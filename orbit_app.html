<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ORBIT</title>
<style>
:root{--bg:#0b0d12;--card:#141824;--card2:#10141f;--line:#232a3b;--txt:#e8ecf6;--mut:#8b94ab;--a:#7cf5c4;--b:#6c8cff;--h:56px;--n:64px}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box}
input,textarea{-webkit-user-select:text;user-select:text;font-size:16px!important;font-family:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--txt);touch-action:manipulation;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;touch-action:manipulation;cursor:pointer}
p,h1,h2,h3{margin:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header.top{flex:none;height:calc(var(--h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);background:rgba(11,13,18,.9);backdrop-filter:blur(14px)}
.ib{width:44px;height:44px;border:0;background:none;color:var(--txt);display:grid;place-items:center;border-radius:50%;font-size:26px;line-height:1}
.ib:active{background:var(--card)}
#ttl{flex:1;font-weight:700;font-size:18px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ttl.logo{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:4px}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 16px calc(26px + env(safe-area-inset-bottom));display:none;scrollbar-width:none}
.view::-webkit-scrollbar{display:none;width:0}
.view.on{display:block;animation:in .3s cubic-bezier(.2,.8,.2,1)}
#v-home{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:0}}
nav.tabs{flex:none;height:calc(var(--n) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:rgba(11,13,18,.92);backdrop-filter:blur(14px)}
.tab{border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;transition:color .2s}
.tab.on{color:var(--a)}
.tab.on svg{filter:drop-shadow(0 0 6px rgba(124,245,196,.6))}
.mut,small{color:var(--mut)}

/* 히어로 */
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 18px 17px;border-radius:24px;background:linear-gradient(135deg,#182036,#101522);border:1px solid var(--line);margin-bottom:16px}
.hero h2{font-weight:750;font-size:29px;margin:3px 0 5px;letter-spacing:-1px;line-height:1}
.hero h2 .of{color:var(--mut);font-size:19px;font-weight:650}
.hero .meta{font-size:11.5px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap}
.hero .meta b{color:var(--a);font-weight:800}

/* 섹션 헤더 */
.secline{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 3px 9px}
.secline>span{font-size:10.5px;font-weight:850;letter-spacing:.13em;color:var(--mut)}
.secline .side{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--mut)}
.secline button{font-size:11px;font-weight:750;color:var(--txt);text-decoration:underline;text-underline-offset:3px}
.secline button:disabled{color:var(--line);text-decoration:none}

/* 체크 습관 카드 */
.card-h{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);margin-bottom:9px;transition:transform .15s}
.card-h:active{transform:scale(.985)}
.card-h.done{background:linear-gradient(120deg,color-mix(in srgb,var(--c) 13%,var(--card)),var(--card))}
.em{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--c) 17%,transparent);flex:none}
.fl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fl b{font-size:14.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl small{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;font-size:19px;font-weight:700;transition:.25s;flex:none}
.chk.on{background:var(--c);border-color:var(--c);color:#06120d;transform:scale(1.06);box-shadow:0 0 16px color-mix(in srgb,var(--c) 50%,transparent)}

/* 카운터 카드 (TALLYPAD 코어) */
.cc{--c:#7cf5c4;position:relative;border-radius:20px;background:var(--card);border:1px solid var(--line);padding:13px 14px 12px;margin-bottom:9px;transition:transform .15s}
.cc:active{transform:scale(.99)}
.cc.done{border-color:color-mix(in srgb,var(--c) 45%,var(--line));background:linear-gradient(150deg,color-mix(in srgb,var(--c) 11%,var(--card)),var(--card))}
.cc-top{display:flex;align-items:flex-start;gap:10px}
.cc-top .em{width:38px;height:38px;font-size:19px;border-radius:12px}
.cc-nm{flex:1;min-width:0}
.cc-nm b{display:block;font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-nm small{display:block;font-size:10.5px;color:var(--mut);margin-top:2px;font-variant-numeric:tabular-nums}
.pct{flex:none;font-size:10.5px;font-weight:850;letter-spacing:.03em;color:var(--c);padding:4px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.valrow{display:flex;align-items:baseline;gap:6px;margin-top:8px}
.valrow .v{font-size:34px;font-weight:850;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:1;transition:transform .16s cubic-bezier(.2,1.4,.5,1)}
.valrow .v.bump{transform:scale(1.08)}
.valrow .goal{font-size:12.5px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.bar{position:relative;height:6px;border-radius:99px;background:#1d2331;margin:9px 0 0;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--c);transition:width .28s cubic-bezier(.2,.8,.2,1)}
.btns{display:flex;gap:7px;margin-top:11px}
.btns button{min-height:48px;border-radius:14px;font-weight:850;transition:transform .1s}
.btns .minus{flex:0 0 68px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:22px}
.btns .plus{flex:1;background:var(--c);color:#06120d;font-size:19px;display:flex;align-items:center;justify-content:center;gap:7px}
.btns .plus em{font-style:normal;font-size:11.5px;font-weight:800;opacity:.72;letter-spacing:.03em}
.btns button:active{transform:scale(.975)}
.btns button:disabled{opacity:.32}
.cc-foot{margin-top:8px;font-size:10.5px;color:var(--mut);line-height:1.5;font-variant-numeric:tabular-nums}

/* 기록 로그 */
.log{list-style:none;padding:0;margin:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.log li{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);font-size:12.5px}
.log li:last-child{border-bottom:0}
.log time{font-size:10.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.log .who{display:flex;align-items:center;gap:7px;min-width:0}
.log .who i{width:7px;height:7px;border-radius:50%;flex:none}
.log .who b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log em{font-style:normal;font-weight:850;font-variant-numeric:tabular-nums;font-size:12.5px}
.log em.down{color:var(--mut)}
.log-empty{padding:15px 13px;font-size:12px;color:var(--mut);line-height:1.6;background:var(--card);border:1px solid var(--line);border-radius:16px}

/* 통계 */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 8px;text-align:center}
.stat b{display:block;font-size:21px;letter-spacing:-.03em}
.stat small{font-size:10.5px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px}
.box>h3{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.box>h3 span{font-size:10.5px;font-weight:650;color:var(--mut)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat i{aspect-ratio:1;border-radius:8px;display:block}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.wrow:first-of-type{border-top:0}
.wrow .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcells{display:flex;gap:4px}
.wcells i{width:15px;height:15px;border-radius:5px;background:#1d2331;display:block}
.legend{display:flex;gap:10px;margin-top:11px;font-size:10px;color:var(--mut);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend b{width:9px;height:9px;border-radius:3px;display:block}

/* 상세 */
.hero.detail h2{font-size:26px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.dbtn{min-height:54px;border-radius:16px;font-weight:850;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--txt)}
.dbtn.primary{background:var(--c,var(--a));border-color:transparent;color:#06120d;font-size:16px}
.btn-ghost{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;font-weight:750;color:var(--txt)}
.btn-danger{background:rgba(226,96,63,.1);border:1px solid rgba(226,96,63,.4);color:#ff8f6b;border-radius:16px;padding:14px;font-weight:750;width:100%}

/* 칩 */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:8px 16px;font-size:14px;transition:.2s;min-height:40px}
.chip.on{background:var(--a);color:#06120d;border-color:var(--a);font-weight:800}

/* 집중 타이머 */
.timer{position:relative;width:min(72vw,280px);margin:14px auto 22px;aspect-ratio:1;transition:filter .4s}
.timer.run{filter:drop-shadow(0 0 20px rgba(124,245,196,.35))}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
#tm{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-2px}
#rg{transition:stroke-dasharray .3s linear}
.btn-orbit{background:linear-gradient(135deg,var(--a),var(--b));color:#06120d;font-weight:800;border:0;border-radius:16px;padding:15px 0;width:100%}
.btn-orbit:active{filter:brightness(.9)}
.empty{text-align:center;color:var(--mut);padding:34px 14px;border:1px dashed var(--line);border-radius:20px;font-size:13px;line-height:1.8}
.center{text-align:center}

/* 분야별 추천 */
.orbit-reco{margin:0 0 14px;padding:13px;border:1px solid var(--line);background:rgba(108,140,255,.065);border-radius:16px}
.orbit-reco-title{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.orbit-reco-title strong{font-size:13px}.orbit-reco-title span{font-size:11px;color:var(--mut)}
.orbit-reco-cats{display:flex;overflow-x:auto;gap:6px;padding:2px 0 9px;scrollbar-width:none;overscroll-behavior-x:contain}
.orbit-reco-cats::-webkit-scrollbar{display:none}
.orbit-reco-cats button{flex:none;min-height:36px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:12.5px;font-weight:750}
.orbit-reco-cats button[aria-pressed="true"]{background:var(--a);color:#06120d;border-color:var(--a)}
.orbit-reco-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:150px;overflow-y:auto;overscroll-behavior:contain}
.orbit-reco-list button{text-align:left;min-width:0;min-height:44px;padding:8px 9px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--txt);font-size:12px;overflow-wrap:anywhere}
.orbit-reco-list button[aria-pressed="true"]{border-color:var(--a);box-shadow:inset 0 0 0 1px var(--a)}

/* 시트 */
#sheetWrap{position:fixed;inset:0;z-index:3000;display:flex;align-items:flex-end}
.scrim{position:absolute;inset:0;background:rgba(4,6,10,.62);animation:fade .18s ease-out}
.sheet{position:relative;width:100%;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  background:#12161f;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.22,1,.36,1)}
.sheet::-webkit-scrollbar{display:none}
@keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:2px auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.sheet-head h2{font-size:16px;font-weight:850}
.sheet-head .x{width:34px;height:34px;border-radius:50%;background:var(--card);color:var(--mut);font-size:15px}
.fld{display:block;margin:13px 0}
.fld>span{display:block;font-size:10.5px;font-weight:850;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
.fld>span em{font-style:normal;color:#5e6779;font-weight:700;letter-spacing:0;margin-left:5px}
.fld input[type=text],.fld input[type=number]{width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--txt)}
.fld input:focus{outline:none;border-color:var(--a)}
.inline{display:flex;align-items:center;gap:7px;margin-top:7px}
.inline input{flex:1;min-width:0}
.inline em{font-style:normal;font-size:11px;color:var(--mut)}
.hint{font-size:10.5px;color:#5e6779;margin-top:7px;line-height:1.6}
.sheet-actions{display:flex;gap:8px;margin-top:16px}
.sheet-actions .danger{flex:0 0 84px;border:1px solid rgba(226,96,63,.4);background:rgba(226,96,63,.1);color:#ff8f6b;font-size:13px;font-weight:800;border-radius:12px;min-height:50px}
.sheet-actions .primary{flex:1;min-height:50px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));color:#06120d;font-size:15px;font-weight:850}
.col{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;border:2px solid transparent}
.col[aria-pressed="true"]{border-color:var(--txt);box-shadow:0 0 0 2px #12161f inset}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(6px);z-index:4000;
  padding:10px 16px;border-radius:12px;background:#eef2fb;color:#0b0d12;font-size:12.5px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

/* APPVERSE PLUS 패널 */
#avplus-fab{position:fixed;z-index:10000;right:16px;bottom:calc(82px + env(safe-area-inset-bottom,0px));height:47px;padding:0 18px;background:linear-gradient(110deg,#3e54db,#7359ea);color:#fff;border:none;border-radius:999px;box-shadow:0 8px 26px #2228;font-size:13px;font-weight:850;font-family:system-ui,sans-serif;letter-spacing:.02em;touch-action:manipulation;cursor:pointer}
#avplus-shade{position:fixed;inset:0;z-index:10001;background:#070f2699;display:none;align-items:flex-end;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;touch-action:auto}
#avplus-shade.open{display:flex}
#avplus-panel{width:100%;max-width:640px;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;padding:22px 19px calc(24px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;background:#f7f8fc;color:#17203a;box-shadow:0 -20px 60px #0004;user-select:text;-webkit-user-select:text;touch-action:pan-y}
#avplus-panel *{box-sizing:border-box}#avplus-panel h2{font-size:24px;line-height:1.2;font-weight:900;margin:3px 0 8px}#avplus-panel p{font-size:13px;color:#64708a;line-height:1.5;margin:5px 0 15px}#avplus-panel button{touch-action:manipulation}
.avp-head{display:flex;justify-content:space-between;align-items:start;gap:12px}.avp-kicker{font-size:10px;font-weight:900;letter-spacing:.13em;color:#626edb}.avp-close{min-width:44px;min-height:44px;border:0;border-radius:13px;background:#e8eaf3;color:#17203a;font-size:23px}
.avp-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:15px 0}.avp-stat{background:white;padding:15px;border-radius:17px;border:1px solid #e7e9f0}.avp-stat b{display:block;font-size:25px;letter-spacing:-.04em;font-weight:900;overflow-wrap:anywhere}.avp-stat span{display:block;font-size:12px;color:#68738b;font-weight:700;margin-top:3px}
.avp-card{background:white;border:1px solid #e7e9f0;border-radius:17px;padding:15px;margin-top:12px}.avp-card h3{font-size:15px;font-weight:850;margin:0 0 10px}.avp-progress{height:9px;border-radius:99px;background:#e9edf5;overflow:hidden;margin:8px 0}.avp-progress i{display:block;height:100%;background:linear-gradient(90deg,#5065e9,#8c72f3);border-radius:inherit}.avp-rows{display:grid;gap:9px}.avp-item{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}.avp-item b{font-weight:800}.avp-item small{color:#728096}.avp-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}.avp-actions button{padding:12px 9px;border:0;border-radius:13px;background:#e9edf8;color:#27304c;font-size:13px;font-weight:800;min-height:44px}.avp-actions .primary{background:#2735ab;color:white}.avp-bars{display:flex;align-items:end;gap:5px;height:100px;margin:16px 0 9px}.avp-bars div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px;height:100%;font-size:10px;color:#68738b}.avp-bars i{width:100%;max-width:42px;background:linear-gradient(180deg,#8a7afa,#4e62d7);border-radius:7px 7px 2px 2px;min-height:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cf5c4"/><stop offset="1" stop-color="#6c8cff"/></linearGradient></defs></svg>

<div id="app">
  <header class="top">
    <button class="ib" id="back" hidden aria-label="뒤로가기">‹</button>
    <div id="ttl" class="logo">ORBIT</div>
    <button class="ib" id="add" aria-label="항목 추가">＋</button>
  </header>
  <main id="views">
    <section class="view" id="v-home"></section>
    <section class="view" id="v-focus"></section>
    <section class="view" id="v-stats"></section>
    <section class="view" id="v-set"></section>
    <section class="view" id="v-detail"></section>
  </main>
  <nav class="tabs" id="tabs"></nav>
</div>

<div id="sheetWrap" hidden>
  <div class="scrim" data-close="1"></div>
  <form class="sheet" id="sheet" autocomplete="off">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="sheetTitle">새 항목</h2><button class="x" type="button" data-close="1" aria-label="닫기">✕</button></div>
    <label class="fld"><span>이름</span><input id="fName" type="text" maxlength="20" placeholder="예) 독서 30분" aria-label="이름"></label>
    <div class="fld"><span>방식</span>
      <div class="chips" id="typeChips" role="group" aria-label="방식">
        <button class="chip" type="button" data-type="check">✓ 체크</button>
        <button class="chip" type="button" data-type="count">🔢 카운터</button>
      </div>
      <p class="hint">체크는 하루 한 번, 카운터는 목표까지 +단위로 쌓습니다.</p>
    </div>
    <div id="countFields">
      <label class="fld"><span>목표<em>비워도 됨</em></span><input id="fGoal" type="number" inputmode="numeric" min="0" step="1" placeholder="예) 2000" aria-label="목표"></label>
      <label class="fld"><span>단위<em>표시용</em></span><input id="fUnit" type="text" maxlength="6" placeholder="ml, 세트, 회" aria-label="단위"></label>
      <div class="fld"><span>한 번에 오르는 양</span>
        <div class="chips" id="stepChips" role="group" aria-label="증감 단위">
          <button class="chip" type="button" data-step="1">+1</button>
          <button class="chip" type="button" data-step="5">+5</button>
          <button class="chip" type="button" data-step="10">+10</button>
        </div>
        <div class="inline"><input id="fStep" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="증감 단위 직접 입력"><em>직접 입력</em></div>
      </div>
    </div>
    <div class="orbit-reco" aria-label="분야별 습관 추천">
      <div class="orbit-reco-title"><strong>분야별 습관 추천</strong><span>누르면 이름과 아이콘이 채워집니다</span></div>
      <div id="recoCats" class="orbit-reco-cats" role="group" aria-label="분야"></div>

    <div class="sheet-actions">

</div>

<script type="application/json" id="seed">
{"habits":[],"log":[],"sessions":[],"settings":{"focus":25,"break":5},"v":2,"userHabitMigrationDone":true}
</script>

<script>
/* ---------- 확대 방지 ---------- */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
let lastT=0,lastEl=null;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastT<350&&e.target===lastEl&&!e.target.closest('input'))e.preventDefault();lastT=n;lastEl=e.target},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- 유틸 ---------- */
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>Number(n||0).toLocaleString('ko-KR');
const K='orbit.v1';
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const dayAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymd(d)};
const TODAY=()=>ymd(new Date());
const hm=t=>{const d=new Date(t);return pad2(d.getHours())+':'+pad2(d.getMinutes())};

/* ---------- 데이터 ---------- */
let S;
try{S=JSON.parse(localStorage.getItem(K))}catch{}
if(!S||!Array.isArray(S.habits))S=JSON.parse($('#seed').textContent);
S.log=Array.isArray(S.log)?S.log:[];
S.sessions=Array.isArray(S.sessions)?S.sessions:[];
S.settings=S.settings||{focus:25,break:5};
/* 이전 배포본이 자동 삽입했던 습관 1회 정리 */
if(!S.userHabitMigrationDone){
  const auto={'h1':'물 2L 마시기','h2':'코딩 1시간','h3':'운동'};
  S.habits=S.habits.filter(h=>!(auto[h.id]===h.name&&(!h.log||Object.keys(h.log).length===0)));
  S.userHabitMigrationDone=true;save();
}
/* v1 → v2: 항목 종류(체크/카운터) 필드 보강 */
S.habits.forEach(h=>{
  if(!h.log||typeof h.log!=='object')h.log={};
  if(h.type!=='count')h.type='check';
  h.goal=Math.max(0,Math.round(+h.goal||0));
  h.step=Math.max(1,Math.round(+h.step||1));
  h.unit=String(h.unit||'').slice(0,6);
  if(!h.color)h.color='#7cf5c4';
});
if(S.v!==2){S.v=2;save()}

function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch{}}

/* ---------- 달성 판정 ---------- */
const isDone=(h,d)=>{const v=h.log[d];if(h.type!=='count')return!!v;const n=+v||0;return h.goal>0?n>=h.goal:n>0};
const todayAmount=h=>+(h.log[TODAY()]||0);
const streak=h=>{let n=0,i=isDone(h,dayAgo(0))?0:1;while(isDone(h,dayAgo(i))){n++;i++}return n};
const pctOf=h=>{if(h.type!=='count')return isDone(h,TODAY())?100:0;const g=h.goal>0?h.goal:Math.max(1,+h.log[TODAY()]||0);return Math.min(100,Math.round(todayAmount(h)/g*100))};

function pushLog(e){S.log.push(e);if(S.log.length>400)S.log=S.log.slice(-400)}
function todayLog(){const t=TODAY();return S.log.filter(e=>ymd(new Date(e.t))===t)}

const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch{}};
let toastTimer=null;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),1900)}

/* ---------- 아이콘 / 조각 ---------- */
const ICON={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',focus:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',stats:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const NAMES={home:'홈',focus:'집중',stats:'통계',set:'설정'};
$('#tabs').innerHTML=Object.keys(NAMES).map(k=>`<button class="tab" data-tab="${k}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${NAMES[k]}</button>`).join('');

const ring=(p,s,txt)=>`<div style="width:${s}px;height:${s}px;position:relative;flex:none"><svg viewBox="0 0 40 40" width="${s}" height="${s}" style="transform:rotate(-90deg)"><circle cx="20" cy="20" r="16" fill="none" stroke="#232a3b" stroke-width="4"/><circle cx="20" cy="20" r="16" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="${p} 100" stroke-opacity="${p>0?1:0}"/></svg><b style="position:absolute;inset:0;display:grid;place-items:center;font-size:${Math.round(s/5.4)}px;font-weight:800">${txt}</b></div>`;
const heat=(f,c)=>`<div class="heat">${Array.from({length:28},(_,i)=>{const d=dayAgo(27-i);return `<i title="${d}" style="background:${c};opacity:${(.1+.9*f(d)).toFixed(2)}"></i>`}).join('')}</div>`;

/* ---------- 카드 ---------- */
function checkCard(h){
  const on=isDone(h,TODAY()), st=streak(h);
  return `<div class="card-h ${on?'done':''}" data-open="${h.id}" style="--c:${h.color}">
    <div class="em">${h.emoji}</div>
    <div class="fl"><b>${esc(h.name)}</b><small>${on?'오늘 완료':(st?'🔥 '+st+'일 연속':'아직 오늘 전')}${st&&!on?' · 연속 끊김':''}</small></div>
    <button class="chk ${on?'on':''}" data-tog="${h.id}" style="--c:${h.color}" aria-label="${esc(h.name)} ${on?'완료 해제':'완료 체크'}">✓</button>
  </div>`;
}
function countCard(h){
  const v=todayAmount(h),p=pctOf(h),done=isDone(h,TODAY());
  const mine=todayLog().filter(e=>e.id===h.id),last=mine.length?mine[mine.length-1].t:0;
  const unit=h.unit?' '+esc(h.unit):'';
  const foot=[mine.length?'오늘 '+mine.length+'회 · 마지막 '+hm(last):'오늘 기록 없음'];
  if(h.goal>0)foot.push(done?'목표 달성':('목표까지 '+nf(h.goal-v)+unit));
  return `<div class="cc ${done?'done':''}" data-open="${h.id}" style="--c:${h.color}">
    <div class="cc-top"><div class="em">${h.emoji}</div>
      <div class="cc-nm"><b>${esc(h.name)}</b><small>1회 +${nf(h.step)}${unit}</small></div>
      ${h.goal>0?`<span class="pct">${p>=100?'달성':p+'%'}</span>`:''}</div>
    <div class="valrow"><b class="v" data-v="${h.id}">${nf(v)}</b><span class="goal">${h.goal>0?'/ '+nf(h.goal)+unit:(h.unit||'')}</span></div>
    ${h.goal>0?`<div class="bar"><i style="width:${p}%"></i></div>`:''}
    <div class="btns">
      <button class="minus" data-dec="${h.id}" ${v<=0?'disabled':''} aria-label="${esc(h.name)} ${nf(h.step)}${unit} 줄이기">−</button>
      <button class="plus" data-inc="${h.id}" aria-label="${esc(h.name)} ${nf(h.step)}${unit} 늘리기">＋<em>${nf(h.step)}${unit}</em></button>
    </div>
    <div class="cc-foot">${foot.join(' · ')}</div>
  </div>`;
}
const card=h=>h.type==='count'?countCard(h):checkCard(h);

function logList(max){
  const list=todayLog().slice().reverse().slice(0,max||99);
  if(!list.length)return `<div class="log-empty">오늘 바뀐 기록이 아직 없어요. 체크를 누르거나 카운터의 ＋를 누르면 여기에 쌓입니다.</div>`;
  return `<ul class="log">${list.map(e=>{
    const h=S.habits.find(x=>x.id===e.id);
    const label=e.kind==='check'?(e.delta>0?'체크':'체크 해제'):((e.delta>0?'+':'−')+nf(Math.abs(e.delta))+(h&&h.unit?' '+esc(h.unit):''));
    return `<li><time>${hm(e.t)}</time><div class="who"><i style="background:${e.color}"></i><b>${esc(e.name)}</b></div><em class="${e.delta<0||e.kind==='check'&&e.delta<0?'down':''}">${label}</em></li>`;
  }).join('')}</ul>`;
}

/* ---------- 화면 ---------- */
const R={
home(){
  const t=TODAY(),hs=S.habits,done=hs.filter(h=>isDone(h,t)).length,p=hs.length?done/hs.length*100:0;
  const best=Math.max(0,...hs.map(streak)),acts=todayLog().length;
  const ds=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
  const allDone=hs.length&&done===hs.length;
  return `<div class="hero">
    <div><div class="mut" style="font-size:12px">${ds}</div><h2>오늘 ${done}<span class="of">/${hs.length}</span></h2>
      <div class="meta"><span>${allDone?'전부 클리어 🔥':(hs.length?'🔥 최고 '+best+'일 연속':'궤도를 만들어요')}</span><span>기록 ${acts}건</span></div></div>
    ${ring(Math.round(p),96,Math.round(p)+'%')}</div>
    <div class="secline"><span>오늘의 보드</span><div class="side"><span>체크 ${hs.filter(h=>h.type!=='count').length} · 카운터 ${hs.filter(h=>h.type==='count').length}</span></div></div>
    ${hs.length?hs.map(card).join(''):'<div class="empty">아직 등록한 항목이 없어요.<br>우측 상단 ＋로 체크 습관이나 카운터를 만들어 보세요.</div>'}
    <div class="secline"><span>오늘 기록</span><div class="side"><span>${todayLog().length}건</span><button data-act="undo" ${todayLog().length?'':'disabled'}>마지막 되돌리기</button></div></div>
    ${logList(10)}
    <p class="mut center" style="font-size:10.5px;margin-top:16px;line-height:1.7">숫자는 오늘 기준으로 쌓이고, 날짜가 바뀌면 새로 시작합니다.<br>모든 기록은 이 기기에만 저장돼요.</p>`;
},
focus(){const ss=S.sessions.filter(s=>s.d==TODAY());
  return `<div class="center mut" id="mode" style="letter-spacing:4px;font-weight:800;font-size:11px;margin-top:6px"></div>
  <div class="timer" id="tw"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#232a3b" stroke-width="2.4"/><circle id="rg" cx="20" cy="20" r="17" fill="none" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/></svg>
  <div class="c"><div id="tm">00:00</div><small>오늘 ${ss.length}세션 · ${ss.reduce((a,s)=>a+s.m,0)}분</small></div></div>
  <div class="chips" style="justify-content:center;margin-bottom:18px">${[15,25,45,60].map(m=>`<button class="chip ${S.settings.focus==m?'on':''}" data-fm="${m}">${m}분</button>`).join('')}</div>
  <div style="display:flex;gap:8px"><button class="btn-orbit" id="go" data-act="go" style="flex:1"></button><button class="btn-ghost" style="width:64px" data-act="rst">↺</button></div>`},
stats(){
  const tot=S.sessions.reduce((a,s)=>a+s.m,0),bs=Math.max(0,...S.habits.map(streak));
  const days=Array.from({length:7},(_,i)=>{const d=dayAgo(6-i);return{d,l:'일월화수목금토'[new Date(d+'T00:00').getDay()],m:S.sessions.filter(s=>s.d==d).reduce((a,s)=>a+s.m,0),p:S.habits.length?S.habits.filter(h=>isDone(h,d)).length/S.habits.length*100:0}});
  const mx=Math.max(30,...days.map(x=>x.m));
  const bars=days.map((x,i)=>{const h=Math.max(x.m/mx*90,3);return `<rect x="${i*42+8}" y="${110-h}" width="26" height="${h}" rx="7" fill="url(#g)" style="transform-box:fill-box;transform-origin:bottom;animation:grow .6s ${i*.06}s cubic-bezier(.2,.8,.2,1) both"/><text x="${i*42+21}" y="130" text-anchor="middle" fill="#8b94ab" font-size="11">${x.l}</text>`}).join('');
  const f=d=>S.habits.length?S.habits.filter(h=>isDone(h,d)).length/S.habits.length:0;
  const week=Array.from({length:7},(_,i)=>dayAgo(6-i));
  const rows=S.habits.length?S.habits.map(h=>`<div class="wrow"><span class="nm">${h.emoji} ${esc(h.name)}</span><span class="wcells">${week.map(d=>`<i title="${d}" style="background:${isDone(h,d)?h.color:'#1d2331'}"></i>`).join('')}</span></div>`).join(''):'<p class="mut" style="font-size:12px">등록한 항목이 없어요.</p>';
  const weekAvg=Math.round(days.reduce((a,x)=>a+x.p,0)/7);
  return `<div class="grid3"><div class="stat"><b>${tot}</b><small>총 집중(분)</small></div><div class="stat"><b>${S.sessions.length}</b><small>세션</small></div><div class="stat"><b>${bs}</b><small>최장 연속</small></div></div>
  <div class="box"><h3>이번 주 달성률 <span>평균 ${weekAvg}%</span></h3>
    <div style="display:flex;gap:5px;align-items:end;height:84px">${days.map(x=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px;height:100%"><i style="width:100%;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#7cf5c4,#6c8cff);height:${Math.max(4,x.p)}%"></i><small style="font-size:10px">${x.l}</small></div>`).join('')}</div>
  </div>
  <div class="box"><h3>습관별 최근 7일</h3>${rows}
    <div class="legend"><span><b style="background:#1d2331"></b>미달성</span><span><b style="background:#7cf5c4"></b>달성</span></div></div>
  <div class="box"><h3>이번 주 집중 시간</h3><svg viewBox="0 0 300 140" width="100%">${bars}</svg></div>
  <div class="box"><h3>최근 28일 달성도</h3>${heat(f,'#7cf5c4')}</div>`},
set(){return `<div class="box"><h3>휴식 시간</h3><div class="chips">${[3,5,10,15].map(m=>`<button class="chip ${S.settings.break==m?'on':''}" data-bm="${m}">${m}분</button>`).join('')}</div></div>
  <div class="box"><h3>데이터 <span>JSON</span></h3><div style="display:grid;gap:9px"><button class="btn-ghost" data-act="exp">백업 내보내기</button><label class="btn-ghost center" style="display:block">백업 불러오기<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="btn-danger" data-act="wipe">전체 초기화</button></div></div>
  <div class="center mut" style="font-size:10.5px;line-height:1.8">ORBIT v2.0 · 습관 체크 + 카운터<br>데이터는 이 기기에만 저장돼요</div>`},
detail(){const h=S.habits.find(x=>x.id==sel);if(!h)return '';
  const n28=Array.from({length:28},(_,i)=>isDone(h,dayAgo(i))?1:0).reduce((a,b)=>a+b),r=Math.round(n28/28*100);
  const st=streak(h),v=todayAmount(h),p=pctOf(h),unit=h.unit?' '+esc(h.unit):'';
  const top=`<div class="hero detail" style="--c:${h.color}"><div><div class="mut" style="font-size:12px">${h.emoji} ${esc(h.name)}</div><h2>🔥 ${st}일</h2><div class="mut" style="font-size:11.5px">현재 연속 기록</div></div>${ring(r,92,r+'%')}</div>`;
  const body=h.type==='count'?`
    <div class="box" style="--c:${h.color}"><h3>오늘 <span>${h.goal>0?'목표 '+nf(h.goal)+unit:'목표 없음'}</span></h3>
      <div class="valrow"><b class="v" data-v="${h.id}" style="font-size:40px">${nf(v)}</b><span class="goal">${h.goal>0?'/ '+nf(h.goal)+unit:(h.unit||'')}</span>${h.goal>0?`<span class="pct" style="margin-left:auto">${p>=100?'달성':p+'%'}</span>`:''}</div>
      ${h.goal>0?`<div class="bar"><i style="width:${p}%"></i></div>`:''}
      <div class="btns"><button class="minus" data-dec="${h.id}" ${v<=0?'disabled':''}>−</button><button class="plus" data-inc="${h.id}">＋<em>${nf(h.step)}${unit}</em></button></div>
      <div class="cc-foot">1회 +${nf(h.step)}${unit}${h.goal>0?(isDone(h,TODAY())?' · 목표 달성':' · 목표까지 '+nf(Math.max(0,h.goal-v))+unit):''}</div>
    </div>
    <div class="dgrid"><div class="stat"><b>${nf(v)}</b><small>오늘 누적</small></div><div class="stat"><b>${Object.keys(h.log).length}</b><small>기록한 날</small></div></div>`
    :`<div class="dgrid"><button class="dbtn primary" data-tog="${h.id}" style="--c:${h.color}">${isDone(h,TODAY())?'오늘 완료 ✓':'오늘 체크'}</button><div class="stat"><b>${Object.keys(h.log).filter(d=>isDone(h,d)).length}</b><small>총 달성일</small></div></div>`;
  return `${top}${body}
  <div class="box"><h3>최근 28일 <span>${n28}/28</span></h3>${heat(d=>isDone(h,d)?1:0,h.color)}</div>
  <div style="display:flex;gap:9px"><button class="btn-ghost" style="flex:1" data-edit="${h.id}">항목 수정</button><button class="btn-danger" style="flex:1" data-act="del">항목 삭제</button></div>`;
}
};
</script>
<script>
/* ---------- 네비게이션 / 이벤트 ---------- */
const TITLES={home:'ORBIT',focus:'집중',stats:'통계',set:'설정',detail:''};
let stack=['home'],sel=null;
history.replaceState({},'');
function render(){const v=stack[stack.length-1];
  $$('.view').forEach(e=>e.classList.toggle('on',e.id=='v-'+v));
  $('#v-'+v).innerHTML=R[v]();
  $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab==stack[0]));
  $('#back').hidden=stack.length<2;$('#add').hidden=v!='home';
  const h=S.habits.find(x=>x.id===sel);
  $('#ttl').textContent=v=='detail'?(h?h.name:''):TITLES[v];
  $('#ttl').classList.toggle('logo',v=='home');
  paintTimer();}
window.addEventListener('popstate',()=>{if(stack.length>1){stack.pop();render()}});

/* ---------- 값 변경 (체크 / 카운터 증감) ---------- */
function bump(id){const el=$(`[data-v="${id}"]`);if(!el)return;el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),200)}
function inc(id,dir){
  const h=S.habits.find(x=>x.id===id);if(!h)return;
  const t=TODAY();
  if(h.type!=='count'){
    const on=!!h.log[t];
    if(on)delete h.log[t];else h.log[t]=1;
    pushLog({t:Date.now(),id:h.id,name:h.name,kind:'check',delta:on?-1:1,color:h.color});
    save();buzz(14);render();return;
  }
  const before=+(h.log[t]||0);
  const next=Math.max(0,before+dir*h.step);
  if(next===before)return;
  h.log[t]=next;
  pushLog({t:Date.now(),id:h.id,name:h.name,kind:'count',delta:next-before,prev:before,color:h.color});
  save();buzz(7);render();bump(h.id);
  if(h.goal>0&&before<h.goal&&next>=h.goal)toast(`${h.name} 목표 달성 🎉`);
  else if(h.goal>0&&before>=h.goal&&next<h.goal)toast('목표 아래로 내려갔어요');
}
function undo(){
  const t=TODAY();
  for(let i=S.log.length-1;i>=0;i--){
    const e=S.log[i];if(ymd(new Date(e.t))!==t)continue;
    const h=S.habits.find(x=>x.id===e.id);
    if(h){
      if(e.kind==='check'){if(e.delta>0)delete h.log[t];else h.log[t]=1}
      else{const back=e.prev!=null?e.prev:Math.max(0,(+(h.log[t]||0))-e.delta);if(back>0)h.log[t]=back;else delete h.log[t]}
    }
    S.log.splice(i,1);save();render();toast('한 건 되돌렸어요');return;
  }
  toast('되돌릴 기록이 없어요');
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tog],[data-inc],[data-dec],[data-open],[data-edit],[data-fm],[data-bm],[data-act],[data-em],[data-reco-cat],[data-reco-name],[data-close],.tab,#back');
  if(!t)return;
  const d=t.dataset;
  if(d.tog){inc(d.tog,1);return}
  if(d.inc){inc(d.inc,1);return}
  if(d.dec){inc(d.dec,-1);return}
  if(d.open){sel=d.open;stack.push('detail');history.pushState({},'');render();return}
  if(d.edit){openSheet(d.edit);return}
  if(d.tab){stack=[d.tab];sel=null;render();return}
  if(t.id=='back'){history.back();return}
  if(d.close!==undefined){closeSheet();return}
  if(d.fm){if(!T.run){S.settings.focus=+d.fm;save();setMode('focus');render()}else toast('타이머를 멈춘 뒤 바꿔주세요');return}
  if(d.bm){S.settings.break=+d.bm;save();if(T.mode=='break'&&!T.run)setMode('break');render();return}
  if(d.em){em=d.em;drawEms();return}
  if(d.recoCat){recoCat=d.recoCat;recoName='';drawReco();return}
  if(d.recoName){$('#fName').value=d.recoName;em=d.recoEmoji;recoName=d.recoName;drawReco();drawEms();return}
  if(d.act=='go')startPause();
  if(d.act=='rst'){setMode(T.mode);paintTimer()}
  if(d.act=='undo')undo();
  if(d.act=='del'){
    const h=S.habits.find(x=>x.id===sel);
    if(h&&confirm(`‘${h.name}’ 항목을 삭제할까요? 기록도 함께 사라져요.`)){
      S.habits=S.habits.filter(x=>x.id!=sel);save();history.back();
      setTimeout(()=>{stack=['home'];render();toast('항목을 삭제했어요')},60);
    }
    return;
  }
  if(d.act=='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='orbit-backup.json';a.click();toast('백업 파일을 저장했어요')}
  if(d.act=='wipe'&&confirm('모든 항목과 기록을 지울까요?')){S=JSON.parse($('#seed').textContent);S.habits=[];S.log=[];S.sessions=[];save();setMode('focus');stack=['home'];render();toast('초기화 완료')}
});
document.addEventListener('change',e=>{if(e.target.id!='imp')return;
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.habits))throw 0;S=j;S.sessions=S.sessions||[];S.log=Array.isArray(S.log)?S.log:[];S.settings=S.settings||{focus:25,break:5};S.v=2;
    S.habits.forEach(h=>{h.log=h.log||{};if(h.type!=='count')h.type='check';h.step=Math.max(1,+h.step||1);h.goal=Math.max(0,+h.goal||0)});
    save();setMode('focus');stack=['home'];render();toast('불러오기 완료 ✅')}catch{toast('올바른 백업 파일이 아니에요')}};
  r.readAsText(f)});

/* ---------- 타이머 ---------- */
const T={mode:'focus',left:S.settings.focus*60,total:S.settings.focus*60,run:false,end:0,iv:null};
function setMode(m){clearInterval(T.iv);T.mode=m;T.run=false;T.total=T.left=(m=='focus'?S.settings.focus:S.settings.break)*60}
function paintTimer(){const tm=$('#tm');if(!tm)return;
  tm.textContent=pad2(Math.floor(T.left/60))+':'+pad2(T.left%60);
  $('#rg').setAttribute('stroke-dasharray',((T.total-T.left)/T.total*100)+' 100');
  $('#go').textContent=T.run?'일시정지':(T.left<T.total?'계속':'시작');
  $('#mode').textContent=T.mode=='focus'?'FOCUS':'BREAK';
  $('#tw').classList.toggle('run',T.run);}
function startPause(){
  if(T.run){T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));T.run=false;clearInterval(T.iv)}
  else{T.end=Date.now()+T.left*1000;T.run=true;T.iv=setInterval(tick,250)}
  paintTimer();}
function tick(){const l=Math.max(0,Math.ceil((T.end-Date.now())/1000));if(l!=T.left){T.left=l;paintTimer()}if(l<=0)finish()}
function finish(){clearInterval(T.iv);
  if(T.mode=='focus'){S.sessions.push({d:TODAY(),m:S.settings.focus});save();buzz([200,100,200]);toast(`집중 완료! +${S.settings.focus}분 🎯`);setMode('break')}
  else{buzz(120);toast('휴식 끝, 다시 궤도로 🚀');setMode('focus')}
  render();}

/* ---------- 추가 / 수정 시트 ---------- */
const EMS=['📚','💧','💻','🏃','🏋️','🧘','🛌','🥗','✍️','🎯','📖','☕️','🧹','💊','🎸','📷','🌙','🚭'];
const COLORS=['#7cf5c4','#6c8cff','#ff7ab8','#ffc857','#b58cff','#5ad1ff','#ff9f5a','#8de06a'];
const RECOMMENDATIONS=[
 {id:'health',label:'💧 건강',items:[['💧','물 한 컵 마시기'],['🥗','채소 한 끼 먹기'],['🛌','일찍 잠들기'],['☀️','아침 햇빛 쬐기'],['🦷','치실 사용하기'],['🧴','영양 균형 점검']]},
 {id:'fitness',label:'🏃 운동',items:[['🏃','20분 걷기'],['💪','근력 운동 15분'],['🧘','스트레칭 10분'],['🚴','자전거 타기'],['🪜','계단 이용하기'],['🏋️','스쿼트 20회']]},
 {id:'learning',label:'📚 학습',items:[['📚','독서 20분'],['✍️','오늘 배운 것 정리'],['🗣️','영어 단어 10개'],['💻','코딩 30분'],['📝','복습 15분'],['🧠','새로운 지식 탐구']]},
 {id:'daily',label:'🏡 생활',items:[['🧹','방 정리 10분'],['🧺','세탁물 정리'],['💳','오늘 소비 기록'],['📅','내일 일정 확인'],['🗑️','불필요한 물건 정리'],['📱','휴대폰 사용 줄이기']]},
 {id:'mind',label:'🌿 마음',items:[['🧘','명상 5분'],['✍️','감사한 일 3가지'],['🌬️','심호흡 3분'],['🫶','칭찬 한마디'],['📔','하루 감정 기록'],['🎵','음악 감상 10분']]},
 {id:'creative',label:'🎨 창작',items:[['🎨','그림 그리기'],['📷','사진 한 장 찍기'],['✍️','글쓰기 10분'],['🎹','악기 연습'],['💡','아이디어 하나 기록'],['🛠️','개인 프로젝트 진행']]},
 {id:'social',label:'🤝 관계',items:[['📞','가족에게 연락하기'],['💬','친구에게 안부 전하기'],['❤️','고마움 표현하기'],['🤝','좋은 일 하나 하기'],['👂','상대 이야기 경청'],['📝','응원 메시지 보내기']]}
];
let editing=null,em=EMS[0],formType='check',formStep=1,formColor=COLORS[0],recoCat=RECOMMENDATIONS[0].id,recoName='';
function drawReco(){
  $('#recoCats').innerHTML=RECOMMENDATIONS.map(c=>`<button type="button" data-reco-cat="${c.id}" aria-pressed="${c.id===recoCat}">${c.label}</button>`).join('');
  const c=RECOMMENDATIONS.find(x=>x.id===recoCat)||RECOMMENDATIONS[0];
  $('#recoList').innerHTML=c.items.map(([e2,n])=>`<button type="button" data-reco-name="${n}" data-reco-emoji="${e2}" aria-pressed="${recoName===n}">${e2} ${n}</button>`).join('');
}
const drawEms=()=>{$('#ems').innerHTML=EMS.map(x=>`<button type="button" class="chip ${x===em?'on':''}" data-em="${x}" style="font-size:18px;padding:6px 12px;min-height:40px">${x}</button>`).join('')};
const drawCols=()=>{$('#cols').innerHTML=COLORS.map(c=>`<button type="button" class="chip col" data-color="${c}" aria-pressed="${c===formColor}" style="background:${c}" aria-label="색 ${c}"></button>`).join('')};
function drawType(){
  $$('#typeChips .chip').forEach(b=>b.classList.toggle('on',b.dataset.type===formType));
  $('#countFields').hidden=formType!=='count';
}
function drawStep(){
  $$('#stepChips .chip').forEach(b=>b.classList.toggle('on',+b.dataset.step===formStep));
  $('#fStep').value=formStep;
}
$('#cols').addEventListener('click',e=>{const b=e.target.closest('[data-color]');if(!b)return;formColor=b.dataset.color;drawCols()});
$('#typeChips').addEventListener('click',e=>{const b=e.target.closest('[data-type]');if(!b)return;formType=b.dataset.type;drawType()});
$('#stepChips').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(!b)return;formStep=+b.dataset.step;drawStep()});
$('#fStep').addEventListener('input',()=>{const v=Math.max(1,Math.round(+$('#fStep').value||1));formStep=v;$$('#stepChips .chip').forEach(b=>b.classList.toggle('on',+b.dataset.step===v))});
$('#fName').addEventListener('input',()=>{if(recoName&&$('#fName').value!==recoName){recoName='';drawReco()}});

function openSheet(id){
  editing=id?S.habits.find(x=>x.id===id)||null:null;
  const h=editing;
  $('#sheetTitle').textContent=h?'항목 수정':'새 항목';
  $('#fName').value=h?h.name:'';
  formType=h?h.type:'check';
  em=h?h.emoji:EMS[0];
  formColor=h?h.color:COLORS[(S.habits.length)%COLORS.length];
  formStep=h?h.step:1;
  $('#fGoal').value=h&&h.goal>0?h.goal:'';
  $('#fUnit').value=h?h.unit:'';
  recoCat=RECOMMENDATIONS[0].id;recoName='';
  drawEms();drawCols();drawReco();drawType();drawStep();
  $('#delBtn').hidden=!h;
  $('#sheetWrap').hidden=false;
  document.body.style.overflow='hidden';
}
function closeSheet(){$('#sheetWrap').hidden=true;editing=null;document.body.style.overflow=''}
$('#add').onclick=()=>openSheet(null);
$('#delBtn').onclick=()=>{
  if(!editing)return;
  const h=editing;
  if(!confirm(`‘${h.name}’ 항목을 삭제할까요?`))return;
  S.habits=S.habits.filter(x=>x.id!==h.id);save();closeSheet();
  if(sel===h.id){sel=null;stack=['home']}
  render();toast('항목을 삭제했어요');
};
$('#sheet').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('#fName').value.trim();
  if(!name){$('#fName').focus();toast('이름을 입력해 주세요');return}
  const goal=Math.max(0,Math.round(+$('#fGoal').value||0));
  const unit=$('#fUnit').value.trim().slice(0,6);
  const step=Math.max(1,Math.round(+$('#fStep').value||1));
  const wasEdit=!!editing;
  if(wasEdit){
    editing.name=name;editing.emoji=em;editing.color=formColor;editing.type=formType;
    editing.goal=goal;editing.unit=unit;editing.step=step;
  }else{
    S.habits.push({id:'h'+Date.now(),name,emoji:em,color:formColor,type:formType,goal,unit,step,log:{}});
  }
  save();closeSheet();render();toast(wasEdit?'수정했어요 ✨':'추가했어요 ✨');
});

render();
</script>
<script>
/* APPVERSE LAB EDITION — 원본 UI는 유지하고 인사이트 패널만 추가 */
(function(){
'use strict';
const APP="orbit";
const dataKey='orbit.v1';
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
function getData(){try{return JSON.parse(localStorage.getItem(dataKey)||'null')||{}}catch{return {}}}
function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
const stat=(label,val)=>`<div class="avp-stat"><b>${escape(val)}</b><span>${escape(label)}</span></div>`;
const box=(title,contents)=>`<section class="avp-card"><h3>${escape(title)}</h3>${contents}</section>`;
const progress=n=>`<div class="avp-progress"><i style="width:${Math.min(100,Math.max(0,Number(n)||0))}%"></i></div>`;
const row=(label,value)=>`<div class="avp-item"><span>${escape(label)}</span><b>${escape(value)}</b></div>`;
const ok=(h,d)=>{const v=(h.log||{})[d];if(h.type!=='count')return !!v;const g=Number(h.goal)||0;return g>0?Number(v)>=g:Number(v)>0};
function insight(){const s=getData(),day=today();
 const habits=Array.isArray(s.habits)?s.habits:[];
 const done=habits.filter(h=>ok(h,day)).length;
 const sessions=Array.isArray(s.sessions)?s.sessions:[];
 const mins=sessions.reduce((a,x)=>a+(Number(x.minutes??x.min??x.duration??0)||0),0);
 const dates=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')});
 let stats=stat('등록 항목',habits.length+'개')+stat('오늘 달성',done+' / '+habits.length)+stat('오늘 달성률',habits.length?Math.round(done/habits.length*100)+'%':'0%')+stat('집중 세션',sessions.length+'회');
 let sections=box('오늘의 보드',progress(habits.length?done/habits.length*100:0)+(habits.length?`<div class="avp-rows">${habits.map(h=>{
   const v=Number((h.log||{})[day]||0);
   const val=h.type==='count'?(v+(h.goal?' / '+h.goal:'')+(h.unit?' '+h.unit:'')):(ok(h,day)?'완료':'대기');
   return row((h.emoji||'✅')+' '+h.name,val)}).join('')}</div>`:'<p>아직 항목이 없어요. 원래 화면에서 추가해 보세요.</p>'));
 sections+=box('최근 7일 달성 흐름',`<div class="avp-bars">${dates.map(d=>{const n=habits.filter(h=>ok(h,d)).length;const p=habits.length?n/habits.length*100:0;return `<div><i style="height:${Math.max(3,p)}%"></i><span>${d.slice(8)}일</span></div>`}).join('')}</div><p>각 날짜의 항목 달성 비율입니다. 카운터는 목표치를 채운 날만 달성으로 봅니다.</p>`);
 return `<div class="avp-stats">${stats}</div>${sections}`;
}
function open(){const shade=$('#avplus-shade');if(!shade)return;shade.classList.add('open');shade.setAttribute('aria-hidden','false');$('#avplus-content').innerHTML=insight();}
function close(){$('#avplus-shade')?.classList.remove('open');$('#avplus-shade')?.setAttribute('aria-hidden','true');}
function downloadBackup(){const obj=getData();const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.href=u;a.download='orbit-lab-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);}
function install(){if($('#avplus-fab'))return;document.body.insertAdjacentHTML('beforeend',`<button type="button" id="avplus-fab" aria-label="PLUS 인사이트 열기">✦ PLUS</button><div id="avplus-shade" aria-hidden="true"><div id="avplus-panel" role="dialog" aria-modal="true" aria-label="APPVERSE PLUS 인사이트"><div class="avp-head"><div><div class="avp-kicker">APPVERSE LAB EDITION · V2</div><h2>ORBIT 인사이트</h2><p>현재 기록을 토대로 분석한 로컬 대시보드</p></div><button class="avp-close" id="avplus-close" type="button" aria-label="닫기">×</button></div><div id="avplus-content"></div><div class="avp-actions"><button type="button" class="primary" id="avplus-refresh">통계 새로고침</button><button type="button" id="avplus-export">JSON 백업</button></div><p>이 기능은 원본 화면과 기록을 유지합니다. 기록은 이 기기의 APPVERSE 저장 공간에 보관됩니다.</p></div></div>`);$('#avplus-fab').addEventListener('click',open);$('#avplus-close').addEventListener('click',close);$('#avplus-refresh').addEventListener('click',()=>$('#avplus-content').innerHTML=insight());$('#avplus-export').addEventListener('click',downloadBackup);$('#avplus-shade').addEventListener('click',e=>{if(e.target.id==='avplus-shade')close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();
})();
</script></body>
