/* Bootstrap CDN이 막혀도 레이아웃이 유지되도록 사용하는 유틸리티만 동일 의미로 보강 */
*,*::before,*::after{box-sizing:border-box}
.d-flex{display:flex}.flex-wrap{flex-wrap:wrap}.flex-grow-1{flex-grow:1}.align-items-center{align-items:center}.gap-1{gap:.25rem}.gap-2{gap:.5rem}.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:1rem}.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:1rem}
.row{display:flex;flex-wrap:wrap;margin:0 -4px}.row>*{padding:0 4px;width:100%;margin-top:0}.row>.col-6{width:50%}
@media (min-width:768px){.row>.col-md-6{width:50%}}
/* ===== 2. 기반: 문서 자체는 스크롤하지 않음. 뷰 내부만 스크롤하므로 하단 메뉴는 절대 움직이지 않음 ===== */
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{position:fixed;inset:0;width:100%;font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.5;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a,button,input,select,textarea,label,summary,[data-act]{touch-action:manipulation}
input,textarea,.selectable{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
:focus-visible{outline:2.500px solid var(--link);outline-offset:2px;border-radius:6px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.900;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ===== 3. 앱 셸 ===== */
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "views" "tabs"}
#topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between;padding:var(--sat) calc(var(--gutter) - 6px + var(--sar)) 0 calc(var(--gutter) + var(--sal));height:calc(var(--top-h) + var(--sat));background:var(--bg)}
#logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:17px;letter-spacing:.02em;min-height:44px;padding-right:12px;-webkit-user-select:none;user-select:none}
#views{grid-area:views;position:relative;min-height:0;outline:0;overflow:hidden}
.view{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:none;background:var(--bg)}
.view.is-on{display:block}
.view.enter-push{animation:push var(--t-mid) var(--ease-move)}
.view.enter-back{animation:fadein var(--t-fast) linear}
@keyframes push{from{transform:translate3d(28px,0,0);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:.5}to{opacity:1}}
.page{max-width:1120px;margin:0 auto;padding:6px calc(var(--gutter) + var(--sar)) 40px calc(var(--gutter) + var(--sal))}
.page.narrow{max-width:720px}
#tabbar{grid-area:tabs;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:0 var(--sar) var(--sab) var(--sal);z-index:20}
#tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:var(--tab-h);color:var(--ink-3);font-size:11px;font-weight:600;-webkit-user-select:none;user-select:none;transition:color var(--t-fast) linear}
#tabbar a[aria-current=page]{color:var(--ink)}
#tabbar a[aria-current=page] .ic{fill:var(--token)}
body.chrome-stack #topbar,body.chrome-run #topbar,body.chrome-run #tabbar{display:none}
body.chrome-stack #tabbar{display:none}
body.chrome-run #app{grid-template-rows:0 minmax(0,1fr) 0}
body.kb-open #tabbar{display:none}
@media (min-width:900px){
  #app{grid-template-columns:92px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"tabs top" "tabs views"}
  #tabbar{display:flex;flex-direction:column;justify-content:center;gap:8px;border-top:0;border-right:1px solid var(--line);padding:0}
  #tabbar a{height:68px}
  body.chrome-stack #tabbar{display:flex}
  body.chrome-run #app{grid-template-columns:0 minmax(0,1fr)}
  :root{--gutter:32px}
}
/* ===== 4. 공통 컨트롤 ===== */
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-pill);flex:none;transition:background var(--t-fast) linear,transform var(--t-fast) var(--ease-out)}
.icon-btn:active{background:var(--surface-2);transform:scale(.93)}
.icon-btn[disabled]{opacity:.35}
.av-btn{min-height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-ctl);font-weight:700;background:var(--surface-2);color:var(--ink);transition:transform var(--t-fast) var(--ease-out),opacity var(--t-fast) linear;white-space:nowrap}
.av-btn:active{transform:scale(.97)}
.av-btn[disabled]{opacity:.45;cursor:not-allowed}
.av-btn.primary{background:var(--ink);color:var(--bg)}
.av-btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.500px var(--danger)}
.av-btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.500px var(--line)}
.av-btn.small{min-height:44px;padding:0 12px;font-size:14px}
.av-btn.block{width:100%}
/* 체험 버튼: 화면 전체에서 유일하게 토큰색을 쓰는 요소 */
.token-btn{min-height:54px;padding:0 26px;border-radius:var(--r-pill);background:var(--token);color:var(--on-token);font-weight:800;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform var(--t-fast) var(--ease-out)}
.token-btn:active{transform:scale(.96)}
.chip{min-height:40px;padding:0 14px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:14px;background:var(--surface);color:var(--ink-2);white-space:nowrap;flex:none}
.chip small{font-size:12px;color:var(--ink-3)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chip[aria-pressed=true] small{color:inherit;opacity:.75}
.rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--gutter));padding:2px var(--gutter);scroll-snap-type:x proximity;overscroll-behavior-x:contain;scroll-padding:var(--gutter)}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start}
.av-badge{display:inline-flex;align-items:center;height:21px;padding:0 7px;border-radius:6px;font-size:11.500px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.av-badge.new{background:var(--ink);color:var(--bg)}
.av-badge.warn{color:var(--warn)}
.badges{display:flex;flex-wrap:wrap;gap:4px}
/* 폼: 16px 이상으로 iOS 입력 자동 확대 방지 */
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-weight:700;font-size:14px;margin-bottom:5px}
.field small,.hint{display:block;color:var(--ink-3);font-size:13px;margin-top:4px}
.err-text{display:block;color:var(--danger);font-size:13px;font-weight:600;margin-top:4px}
.in{width:100%;min-height:46px;padding:10px 12px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.500px solid var(--line);border-radius:var(--r-ctl);outline:0;-webkit-appearance:none;appearance:none}
.in:focus{border-color:var(--link)}
.in.bad{border-color:var(--danger)}
textarea.in{min-height:92px;resize:vertical}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--link);flex:none}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-ctl);padding:3px;gap:2px}
.seg label,.seg button{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink-2);cursor:pointer;text-align:center;padding:0 6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span,.seg button[aria-pressed=true]{color:var(--ink)}
.seg label:has(input:checked),.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--link);outline-offset:2px;border-radius:4px}
/* ===== 5. 홈 ===== */
.sec{margin-top:30px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;min-height:32px}
.sec-head h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
.sec-head a,.sec-head button{color:var(--link);font-weight:700;font-size:14px;min-height:44px;display:inline-flex;align-items:center}
.lede{font-size:clamp(28px,8vw,44px);font-weight:800;line-height:1.14;letter-spacing:-.035em;margin:6px 0 16px;word-break:keep-all;max-width:15em}
.feat{position:relative;flex:0 0 min(86%,520px);aspect-ratio:16/11;border-radius:var(--r-cover);overflow:hidden;background:var(--surface-2);display:block}
.feat img{width:100%;height:100%;object-fit:cover}
.feat-cap{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;background:linear-gradient(transparent,rgba(13,17,48,.82));color:#fff}
.feat-cap h3{font-size:22px;font-weight:800;letter-spacing:-.02em}
.feat-cap p{font-size:14px;opacity:.9;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile{flex:0 0 112px;width:112px;display:block}
.tile img{width:112px;height:112px;border-radius:26px;object-fit:cover;background:var(--surface-2)}
.tile b{display:block;margin-top:7px;font-size:14px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile span{display:block;font-size:12.500px;color:var(--ink-3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rows{border-top:1px solid var(--line)}
.row-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-height:60px;width:100%;text-align:left}
.row-item .grow{flex:1;min-width:0}
.row-item b{display:block;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row-item .sub{display:block;font-size:13px;color:var(--ink-3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row-item img.mini{width:46px;height:46px;border-radius:12px;object-fit:cover;background:var(--surface-2);flex:none}
.empty{padding:44px 14px;text-align:center;color:var(--ink-2)}
.empty svg.orb{width:92px;height:92px;margin:0 auto 12px;display:block}
.empty h3{font-size:19px;font-weight:800;color:var(--ink);margin-bottom:5px;letter-spacing:-.02em}
.empty p{max-width:30em;margin:0 auto 14px;word-break:keep-all}
/* ===== 6. 게시판 ===== */
.search-wrap{position:relative}
.search-wrap .ic{position:absolute;left:12px;top:11px;color:var(--ink-3);pointer-events:none}
.search-wrap .in{padding-left:44px;border-color:transparent}
.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 12px}
.tools .count{font-size:14px;color:var(--ink-2);font-weight:600}
.tools select.in{width:auto;min-height:44px;padding-top:6px;padding-bottom:6px}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:18px 12px}
.app-grid.is-list{grid-template-columns:minmax(0,1fr);gap:0;border-top:1px solid var(--line)}
.app-card{position:relative;min-width:0;content-visibility:auto;contain-intrinsic-size:auto 210px}
.app-card>a{display:block}
.app-card .cover{width:100%;aspect-ratio:4/3;border-radius:18px;object-fit:cover;background:var(--surface-2)}
.app-card .info{padding:8px 2px 0;display:flex;gap:8px;align-items:flex-start}
.app-card .ico{width:38px;height:38px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex:none}
.app-card h3{font-size:15px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.app-card .txt{min-width:0;flex:1}
.app-card .txt p{font-size:13px;color:var(--ink-3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.app-card .badges{margin-top:4px}
.fav-btn{position:absolute;top:4px;right:4px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff;filter:drop-shadow(0 1px 3px rgba(13,17,48,.7))}
.detail-fav .fav-btn{top:0;right:0;color:var(--ink);filter:none}
.av-sheet:focus{outline:0}
.fav-btn[aria-pressed=true] .ic{fill:var(--token);stroke:var(--token)}
.is-list .app-card{border-bottom:1px solid var(--line);contain-intrinsic-size:auto 80px}
.is-list .app-card>a{padding:10px 44px 10px 0}
.is-list .cover{display:none}
.is-list .info{padding:0;align-items:center}
.is-list .ico{width:54px;height:54px;border-radius:14px}
.is-list .fav-btn{top:50%;right:-6px;margin-top:-22px;color:var(--ink-3);filter:none}
/* ===== 7. 스택 화면·상세 ===== */
.av-nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:2px;background:var(--bg);padding:var(--sat) calc(6px + var(--sar)) 0 calc(6px + var(--sal));height:calc(var(--top-h) + var(--sat))}
.av-nav h1{flex:1;font-size:17px;font-weight:800;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.detail-cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r-cover);background:var(--surface-2)}
.detail-id{display:flex;gap:14px;margin-top:-34px;padding:0 12px;position:relative;align-items:flex-end}
.detail-id img{width:88px;height:88px;border-radius:22px;object-fit:cover;background:var(--surface);box-shadow:0 0 0 4px var(--bg)}
.detail-title{margin-top:12px}
.detail-title h2{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.2;word-break:keep-all}
.detail-title p{color:var(--ink-2);font-size:16px;margin-top:2px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:16px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts dt{font-size:12.500px;color:var(--ink-3);font-weight:600}
.facts dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;word-break:keep-all;max-width:38em;line-height:1.65}
.feat-list{margin:0;padding:0;list-style:none}
.feat-list li{padding:9px 0 9px 22px;position:relative;border-bottom:1px solid var(--line)}
.feat-list li::before{content:"";position:absolute;left:3px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--token)}
.shots img{height:300px;width:auto;max-width:82vw;border-radius:16px;background:var(--surface-2);object-fit:cover}
.shots button{flex:none}
.log{border-left:2px solid var(--line);padding:0 0 14px 14px;margin-left:4px}
.log b{font-weight:800}.log time{font-size:13px;color:var(--ink-3);margin-left:6px}
.cta-bar{position:sticky;bottom:0;background:var(--bg);padding:10px calc(var(--gutter) + var(--sar)) calc(10px + var(--sab)) calc(var(--gutter) + var(--sal));display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);z-index:4}
.cta-bar .token-btn{flex:1}
.cta-bar .inner{max-width:720px;margin:0 auto;width:100%;display:flex;gap:6px;align-items:center}
/* ===== 8. 실행 화면 ===== */
.view.run-view{overflow:hidden;background:var(--surface)}
.run{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface)}
.run-bar{display:flex;align-items:center;padding:var(--sat) calc(2px + var(--sar)) 0 calc(2px + var(--sal));height:calc(50px + var(--sat));flex:none;border-bottom:1px solid var(--line)}
.run-bar b{flex:1;min-width:0;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.run-stage{flex:1;min-height:0;position:relative;background:#fff}
.run-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;touch-action:auto}
.run-cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:var(--surface);color:var(--ink);word-break:keep-all}
.run-cover[hidden]{display:none}
.run-foot{flex:none;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px calc(12px + var(--sar)) calc(6px + var(--sab)) calc(12px + var(--sal));font-size:12.500px;color:var(--ink-2);border-top:1px solid var(--line)}
.run-foot button{color:var(--link);font-weight:700;min-height:44px;white-space:nowrap}
.run.immersive .run-bar,.run.immersive .run-foot{display:none}
.run-float{display:none;position:absolute;right:calc(10px + var(--sar));top:calc(10px + var(--sat));width:44px;height:44px;border-radius:50%;background:rgba(18,22,52,.72);color:#fff;align-items:center;justify-content:center;z-index:3}
.run.immersive .run-float{display:flex}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== 9. 모달·토스트 ===== */
.av-modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);animation:fadein var(--t-fast) linear}
.av-sheet{background:var(--surface);width:100%;max-width:560px;max-height:calc(100% - var(--sat) - 28px);overflow-y:auto;overscroll-behavior:contain;border-radius:var(--r-cover) var(--r-cover) 0 0;padding:20px calc(var(--gutter) + var(--sar)) calc(18px + var(--sab)) calc(var(--gutter) + var(--sal));animation:sheet var(--t-slow) var(--ease-move)}
.av-sheet.wide{max-width:860px}
.av-sheet h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px;padding-right:36px}
.av-sheet .x{position:absolute;margin-left:-40px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start}
.sheet-actions{display:flex;gap:8px;margin-top:16px}
.sheet-actions>*{flex:1}
@keyframes sheet{from{transform:translate3d(0,40px,0);opacity:.3}to{transform:none;opacity:1}}
@media (min-width:640px){.av-modal{align-items:center}.av-sheet{border-radius:var(--r-cover)}}
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + var(--sab) + 10px);z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 14px}
body.chrome-run #toasts,body.chrome-stack #toasts{bottom:calc(84px + var(--sab))}
.av-toast{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:var(--r-ctl);min-height:46px;padding:7px 14px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:14px;max-width:460px;box-shadow:var(--shadow-float);animation:sheet var(--t-mid) var(--ease-out);word-break:keep-all}
.av-toast.err{background:var(--danger);color:#fff}
html[data-theme=dark] .av-toast.err{color:#2a0610}
.av-toast button{font-weight:800;min-height:44px;white-space:nowrap;text-decoration:underline}
.preview-frame{width:100%;height:58vh;border:1px solid var(--line);border-radius:var(--r-ctl);background:#fff;display:block}
.report{list-style:none;padding:0;margin:8px 0}
.report li{padding:7px 0 7px 22px;position:relative;font-size:14px;border-bottom:1px solid var(--line);overflow-wrap:anywhere;word-break:keep-all}
.report li::before{position:absolute;left:2px;font-weight:800}
.report .e{color:var(--danger)}.report .e::before{content:"!"}
.report .w{color:var(--warn)}.report .w::before{content:"△";font-size:11px;top:9px}
.report .k{color:var(--ok)}.report .k::before{content:"✓"}
.tree{max-height:190px;overflow:auto;font-size:13px;background:var(--bg);border-radius:var(--r-ctl);padding:8px 10px;margin:8px 0;overflow-wrap:anywhere}
.tree div{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.tree small{color:var(--ink-3);white-space:nowrap}
/* ===== 10. 관리자 ===== */
.demo-banner{background:var(--surface-2);border-radius:var(--r-ctl);padding:10px 12px;font-size:13.500px;color:var(--ink-2);margin-bottom:12px;word-break:keep-all}
.admin-tabs{margin-bottom:12px}
.admin-tabs a{min-height:40px;padding:0 14px;display:flex;align-items:center;border-radius:var(--r-pill);font-weight:700;font-size:14px;color:var(--ink-2);background:var(--surface);flex:none}
.admin-tabs a[aria-current=page]{background:var(--ink);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:14px 0 12px}
.stats b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stats span{font-size:13px;color:var(--ink-3)}
.panel{background:var(--surface);border-radius:var(--r-panel);padding:16px;margin-top:12px}
.panel h3{font-size:16px;font-weight:800;margin-bottom:8px}
.adm-row{display:flex;align-items:center;gap:4px;padding:7px 0;border-bottom:1px solid var(--line)}
.adm-row input[type=checkbox]{width:22px;height:22px;margin:11px;accent-color:var(--link);flex:none}
.adm-row img{width:42px;height:42px;border-radius:11px;object-fit:cover;flex:none;margin-right:6px}
.adm-row .grow{flex:1;min-width:0}
.adm-row b{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.adm-row .sub{font-size:12.500px;color:var(--ink-3);display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bulk{position:sticky;bottom:0;background:var(--surface);border-radius:var(--r-panel);padding:10px;margin-top:12px;box-shadow:var(--shadow-float);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.img-pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.img-pick img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--surface-2)}
.img-pick .thumb{position:relative}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;font-size:16px;cursor:pointer}
/* ===== 11. 스켈레톤·모션 설정 ===== */
.skel{background:var(--surface-2);border-radius:var(--r-cover);animation:pulse 1.300s ease-in-out infinite}
.skel-hero{aspect-ratio:16/11;max-height:320px;margin-top:40px}
.skel-line{height:22px;width:40%;margin:28px 0 12px;border-radius:8px}
.skel-row{display:flex;gap:10px}.skel-tile{width:112px;height:112px}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

  if (j.format !== 'appverse-backup' && j.format !== 'appverse-catalog') { out.errors.push('APPVERSE 백업 파일이 아닙니다(format 필드 없음).'); return out; }
  if (j.schemaVersion > CONFIG.SCHEMA) out.warnings.push('더 새로운 버전에서 만든 파일입니다. 일부 값이 무시될 수 있습니다.');
  const d = j.format === 'appverse-backup' ? j.data : j; out.format = j.format;

  const seen = new Set();
  d.apps.forEach((r, i) => {
    const n = normalizeApp(r);
    if (n.errors.length) { n.errors.forEach(e => out.warnings.push(`${i + 1}번째 앱 제외: ${e}`)); return; }
    if (seen.has(n.app.id)) { out.warnings.push(`중복 ID 제외: ${n.app.id}`); return; }
    seen.add(n.app.id); n.warnings.forEach(w => out.warnings.push(w)); out.apps.push(n.app);
    const cur = Repo.app(n.app.id);
    if (!cur) out.diff.add++; else if (JSON.stringify(cur) === JSON.stringify(n.app)) out.diff.same++; else out.diff.update++;
  });
  const uniq = (arr, norm, label) => { const ids = new Set(), res = []; (Array.isArray(arr) ? arr : []).forEach(x => { const v = norm(x); if (!v) return out.warnings.push(`${label} 항목 제외: 형식 오류`); if (ids.has(v.id)) return out.warnings.push(`${label} 중복 ID 제외: ${v.id}`); ids.add(v.id); res.push(v); }); return res; };

  return out;
}

      reg.zip = r; reg.zipBuf = buf; reg.tested = false; reg.dirty = true; out.innerHTML = zipReportHTML(r);
      const nameInput = $('[name=name]', Router.active.el); if (!r.errors.length && nameInput && !nameInput.value) nameInput.value = file.name.replace(/\.zip$/i, '');
    } catch (e) { out.innerHTML = zipReportHTML({ errors: [`ZIP을 읽지 못했습니다: ${e.message}`], warnings: [], infos: [] }); reg.zip = null; }
  },
  'zip-entry'(el) { if (Reg?.zip) { Reg.zip.entry = el.value; Reg.tested = false; } },
  async 'home-toggle'(el) { const k = el.dataset.k, v = el.checked; await run(() => Repo.mutate(d => { d.settings.home = { ...Repo.settings.home, [k]: v }; }), '홈 구성을 저장했습니다.'); },
  async 'feat-limit'(el) { const s = normSettings({ featuredLimit: el.value }); if (!s.featuredLimit) return toast('1~20 사이로 입력해 주세요.', { err: true }); await run(() => Repo.mutate(d => { d.settings.featuredLimit = s.featuredLimit; }), '저장했습니다.'); },
  async 'import-file'(el) {
    const file = el.files[0]; el.value = ''; if (!file) return;
    const p = parseImport(await file.text()), bad = p.errors.length > 0;
    const li = (c, t) => `<li class="${c}">${esc(t)}</li>`;
    const it = Modal.open(`${sheetHead('복원 전 미리보기')}${bad ? '' : `<div class="stats"><div><b>${p.diff.add}</b><span>새 웹앱</span></div><div><b>${p.diff.update}</b><span>내용 충돌</span></div><div><b>${p.diff.same}</b><span>동일</span></div></div>`}<ul class="report">${p.errors.map(e => li('e', e)).join('')}${p.warnings.slice(0, 30).map(e => li('w', e)).join('')}${bad ? '' : li('k', `구조 검사 통과: 카테고리 ${p.categories.length}개, 공지 ${p.notices.length}개, ZIP 원본 ${p.archives.length}개`)}</ul>${bad ? '' : `<div class="field"><span style="font-weight:700">충돌 처리</span>${[['mine', '내 데이터 유지, 새 항목만 추가', true], ['theirs', '같은 ID는 파일 내용으로 덮어쓰기'], ['replace', '현재 데이터를 파일로 모두 교체']].map(([v, t, c]) => `<label class="check"><input type="radio" name="imp" value="${v}" ${c ? 'checked' : ''}>${t}</label>`).join('')}</div>`}<div class="sheet-actions"><button class="av-btn ghost" type="button" data-act="modal-close">취소</button>${bad ? '' : '<button class="av-btn primary" type="button" data-act="import-apply">적용</button>'}</div>`, { label: '복원 전 미리보기' });
    it.parsed = p;
  }
};
document.addEventListener('click', e => {
  const nav = e.target.closest('a[data-nav]');
  if (nav) { if (e.metaKey || e.ctrlKey || e.shiftKey) return; e.preventDefault(); Router.go(nav.getAttribute('href').slice(1), { replace: 'replace' in nav.dataset }); return; }
  const t = e.target.closest('[data-act]');
  if (t && !t.disabled) { A[t.dataset.act]?.(t, e); return; }
  if (e.target.classList.contains('av-modal')) Modal.close();
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-submit]'); if (f) { e.preventDefault(); SUBMIT[f.dataset.submit]?.(f); } });
document.addEventListener('input', e => { const t = e.target; if (t.dataset.input) INPUT[t.dataset.input]?.(t); if (Reg && t.closest('[data-input-dirty]')) Reg.dirty = true; });
document.addEventListener('change', e => { const t = e.target; if (t.dataset.change) CHANGE[t.dataset.change]?.(t); });
/* 이미지 로딩 실패 대체 (error는 버블링되지 않아 캡처 단계 위임) */
document.addEventListener('error', e => { const t = e.target; if (t.tagName === 'IMG' && t.dataset.fb && t.src !== t.dataset.fb) t.src = t.dataset.fb; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && Modal.stack.length) { Modal.close(); return; } if (e.key === 'Tab' && Modal.stack.length) { const box = Modal.top().el, f = $$('a[href],button:not([disabled]),input,select,textarea,iframe', box).filter(x => x.offsetParent !== null); if (!f.length) return; const a = f[0], z = f[f.length - 1]; if (e.shiftKey && (document.activeElement === a || !box.contains(document.activeElement))) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && (document.activeElement === z || !box.contains(document.activeElement))) { e.preventDefault(); a.focus(); } } });
/* 더블탭 확대 방지: touch-action:manipulation이 기본, 구형 WebView용으로 비대화형 영역의 연속 탭만 차단. 핀치 확대는 접근성을 위해 유지 */
let lastTouch = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (e.touches.length === 0 && n - lastTouch < 320 && !e.target.closest('a,button,input,select,textarea,label,summary,iframe,[data-act]')) e.preventDefault(); lastTouch = n; }, { passive: false });
document.addEventListener('dblclick', e => { if (!e.target.closest('input,textarea')) e.preventDefault(); }, { passive: false });
/* 키보드가 열리면 하단 메뉴를 숨겨 입력창을 가리지 않음 */
const isText = t => t.matches?.('input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select');
const coarse = matchMedia('(pointer: coarse)');
document.addEventListener('focusin', e => { if (coarse.matches && isText(e.target)) document.body.classList.add('kb-open'); });
document.addEventListener('focusout', () => document.body.classList.remove('kb-open'));
['pointerdown', 'keydown'].forEach(t => document.addEventListener(t, () => Auth.touch(), { passive: true }));

/* ========== 22. 부팅 ========== */
const App = {
  refreshBrand() { $('#logoText').textContent = Repo.settings.name; document.title = Repo.settings.name; Theme.apply(); },
  onSessionExpired() { const hit = Router.match(Router.cur || '/'); if (Router.cache.get('/more')) Router.cache.get('/more').sig = ''; toast('데모 세션이 만료되어 로그아웃했습니다.', { ms: 5000 }); if (hit?.r.admin) Router.go('/', { replace: true }); },
  async boot() {
    Prefs.load(); Theme.apply();
    Theme.mq.addEventListener?.('change', () => Theme.apply());
    await DB.open();
    try { await Repo.init(); }
    catch (e) { console.error(e); $('#bootView').innerHTML = `<div class="page">${emptyHTML('목록을 불러오지 못했습니다', '새로고침해 주세요. 문제가 계속되면 브라우저 저장소 설정을 확인해 주세요.')}</div>`; return; }
    App.refreshBrand();
    Router.start();
    if (!Prefs.data.helpSeen && Router.cur === '/') openHelp();
    setInterval(() => Auth.check(), 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) Auth.check(); });
  }
};
App.boot();
})();

</script>
