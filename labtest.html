<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>WAH LAB mobile check</title>
<style>
body{margin:0;background:#20242c;color:#cfd6e4;font:13px system-ui,sans-serif;display:flex;gap:14px;padding:12px}
.col{display:flex;flex-direction:column;gap:6px}
.col b{font-size:11px;letter-spacing:.08em;color:#8fa0bb}
iframe{border:0;background:#000;border-radius:10px;box-shadow:0 8px 24px #0008}
#a{width:390px;height:844px}
#b{width:390px;height:460px}
.bar{display:flex;gap:6px}
.bar button{font:inherit;font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid #3c4a60;background:#2a3341;color:#cfd6e4}
</style>
</head>
<body>
<div class="col">
  <b>390 × 844</b>
  <div class="bar" id="barA"></div>
  <iframe id="a"></iframe>
</div>
<div class="col">
  <b>390 × 460 (키보드 올라온 높이)</b>
  <div class="bar" id="barB"></div>
  <iframe id="b"></iframe>
</div>
<script>
const ids=['snapstudio','typerace','typetaxi','typedefense'];
const params=new URLSearchParams(location.search);
const pick=params.get('id')||'snapstudio';
fetch('index.html?ts='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{
  const pack={};
  const j=t.match(/<script type="application\/json" id="appverse-lab-pack">([\s\S]*?)<\/script>/);
  if(j)Object.assign(pack,JSON.parse(j[1]));
  for(const m of t.matchAll(/^LAB_PACK\.(\w+) = '([^']*)';/gm))pack[m[1]]=m[2];
  const dec=b64=>{const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);};
  for(const [el,bar,h] of [['a','barA',844],['b','barB',460]]){
    const frame=document.getElementById(el);
    frame.srcdoc=dec(pack[pick]);
    const barEl=document.getElementById(bar);
    ids.forEach(id=>{
      const btn=document.createElement('button');
      btn.textContent=id;
      btn.onclick=()=>{location.search='?id='+id;};
      if(id===pick)btn.disabled=true;
      barEl.append(btn);
    });
    const kb=document.createElement('button');
    kb.textContent='키보드 시뮬';
    kb.onclick=()=>{
      frame.contentWindow.postMessage({kind:'appverse-typing-viewport',app:pick,height:320},'*');
      frame.contentWindow.postMessage({kind:'appverse-typing-focus',app:pick,focused:true},'*');
    };
    barEl.append(kb);
    const kb2=document.createElement('button');
    kb2.textContent='키보드 닫기';
    kb2.onclick=()=>{
      frame.contentWindow.postMessage({kind:'appverse-typing-viewport',app:pick,height:h},'*');
      frame.contentWindow.postMessage({kind:'appverse-typing-focus',app:pick,focused:false},'*');
    };
    barEl.append(kb2);
  }
});
</script>
</body>
</html>
