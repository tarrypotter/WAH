<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>WAH mobile QA frame</title>
<style>
html,body{margin:0;height:100%;background:#2b2f38;overflow:hidden}
#phone{display:block;width:390px;height:844px;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="phone" title="WAH mobile preview"></iframe>
<script>
  const lab = new URLSearchParams(location.search).get('lab') || '';
  const base = new URLSearchParams(location.search).get('base') || 'https://tarrypotter.github.io/WAH/';
  document.getElementById('phone').src = base + (lab ? '#/lab/' + lab : '');
</script>
</body>
</html>
