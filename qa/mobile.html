<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>WAH mobile QA frame</title>
<style>
html,body{margin:0;height:100%;background:#2b2f38;overflow:hidden}
#phone{display:block;border:0;background:#fff;width:390px;height:844px}
</style>
</head>
<body>
<iframe id="phone" title="WAH mobile preview"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const phone = document.getElementById('phone');
  phone.style.width = (q.get('w') || 390) + 'px';
  phone.style.height = (q.get('h') || 844) + 'px';
  const base = q.get('base') || 'https://tarrypotter.github.io/WAH/';
  const lab = q.get('lab') || '';
  const hash = q.get('hash') || '';
  phone.src = base + (lab ? '#/lab/' + lab : hash ? '#' + hash : '');
</script>
</body>
</html>
