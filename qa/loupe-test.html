<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0D">
<title>CHROMAPICK · 사진 색 추출</title>
<style>
:root{
  --bg:#0B0B0D; --panel:#131315; --panel2:#1A1A1E; --line:#26262B; --line2:#3A3A42;
  --ink:#F4F0E9; --ink2:#A9A49B; --ink3:#6F6A63;
  --pick:#E8E2D6; --pick-ink:#15150F;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;
  background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--pick);outline-offset:2px;border-radius:10px}
p,h1,h2,h3{margin:0}

.glow{position:fixed;left:50%;top:-90px;width:360px;height:240px;transform:translateX(-50%);border-radius:50%;
  background:var(--pick);filter:blur(72px);opacity:.17;pointer-events:none;z-index:0;transition:background .35s ease}

.top{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:8px;
  padding:calc(var(--sat) + 12px) 16px 10px}
.brand{font-size:12.5px;font-weight:800;letter-spacing:.2em}
.brand span{color:var(--ink3)}
.top .grow{flex:1}
.top .ghost{height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);
  font-size:12px;font-weight:700;color:var(--ink2)}
.top .ghost.solid{background:var(--pick);border-color:var(--pick);color:var(--pick-ink);font-weight:800}
.top .ghost:active{background:var(--panel2)}

.scroll{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:6px 16px 20px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none;width:0}

/* 빈 상태 */
.empty{padding:34px 2px 8px;text-align:center}
.empty h1{font-size:22px;font-weight:850;letter-spacing:-.03em;line-height:1.3}
.empty p{margin:10px 0 22px;font-size:13px;line-height:1.7;color:var(--ink3)}
.empty .btns{display:grid;gap:8px}
.empty .btns button{min-height:50px;border-radius:13px;font-size:14.5px;font-weight:800}
.empty .btns .primary{background:var(--pick);color:var(--pick-ink)}
.empty .btns .ghost{border:1px solid var(--line2);background:var(--panel);color:var(--ink2)}
.dropmark{margin:0 auto 16px;width:56px;height:56px;border-radius:16px;border:1px dashed var(--line2);
  display:grid;place-items:center;font-size:22px;color:var(--ink3)}
.dragover .dropmark{border-color:var(--pick);color:var(--pick)}

/* 사진 */
.shot{margin:4px 0 0}
.shot-frame{position:relative;display:block;width:100%;border-radius:12px}
#photo{display:block;width:auto;height:auto;max-width:100%;max-height:64dvh;margin:0 auto;border-radius:12px;
  background:#000;touch-action:none}
.shot .hint{margin:9px 2px 0;font-size:11.5px;color:var(--ink3);text-align:center}

.loupe{position:absolute;width:132px;height:132px;border-radius:50%;overflow:hidden;display:none;z-index:6;
  transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.92);
  box-shadow:0 12px 28px rgba(0,0,0,.62),0 0 0 1px rgba(0,0,0,.55)}
.loupe.on{display:block}
.loupe canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.loupe::before,.loupe::after{content:"";position:absolute;background:rgba(255,255,255,.55);pointer-events:none}
.loupe::before{left:0;right:0;top:65px;height:1px}
.loupe::after{top:0;bottom:0;left:65px;width:1px}

/* 섹션 */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:20px 2px 9px}
.sec-head h2{font-size:11px;font-weight:850;letter-spacing:.1em;color:var(--ink2)}
.sec-head span{font-size:11px;color:var(--ink3)}
.sec-head .link{font-size:11.5px;font-weight:700;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}

.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sw{display:block;border-radius:11px;border:1px solid var(--line);background:var(--panel);overflow:hidden;padding:0}
.sw .block{display:block;height:50px}
.sw .txt{display:block;padding:5px 5px 6px;text-align:left}
.sw .txt b{display:block;font:10px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.03em}
.sw .txt small{display:block;font-size:9.5px;color:var(--ink3);margin-top:1px}
.sw[aria-pressed="true"]{border-color:var(--pick);box-shadow:0 0 0 1px var(--pick)}
.sw:active{opacity:.82}

.pin-list{display:flex;flex-wrap:wrap;gap:6px}
.pin{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--panel);overflow:hidden}
.pin .main{display:inline-flex;align-items:center;gap:7px;padding:4px 9px 4px 5px;min-height:32px}
.pin i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.pin b{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em}
.pin .del{width:26px;min-height:32px;color:var(--ink3);font-size:14px;border-left:1px solid var(--line)}
.pin .del:active{background:var(--panel2)}
.pins-empty{font-size:12px;color:var(--ink3);line-height:1.6}

.foot-note{margin:22px 2px 0;font-size:11px;line-height:1.7;color:var(--ink3);border-top:1px solid var(--line);padding-top:11px}

/* 하단 도크 */
.dock{position:relative;z-index:3;flex:none;border-top:1px solid var(--line);background:#0E0E10;
  padding:9px 14px calc(9px + var(--sab))}
.dock-top{display:flex;align-items:center;gap:11px}
.swatch{flex:none;width:40px;height:40px;border-radius:12px;background:var(--pick);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.dock-meta{min-width:0;flex:1}
.dock-meta b{display:block;font:16px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;
  letter-spacing:-.02em;user-select:text;-webkit-user-select:text}
.dock-meta small{display:block;font-size:11px;color:var(--ink3);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-top .ghost{flex:none;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line2);
  font-size:12.5px;font-weight:750;color:var(--ink2);background:var(--panel)}
.dock-actions{display:flex;gap:7px;margin-top:8px}
.dock-actions button{min-height:44px;border-radius:12px;font-size:13.5px;font-weight:800}
.dock-actions .primary{flex:1.5;background:var(--pick);color:var(--pick-ink)}
.dock-actions .ghost{flex:1;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);font-weight:750}
.dock-actions button:disabled,.dock-top button:disabled{opacity:.33}

.toast{position:fixed;left:50%;bottom:calc(128px + var(--sab));transform:translateX(-50%) translateY(6px);z-index:40;
  padding:9px 15px;border-radius:11px;background:#F4F0E9;color:#141412;font-size:12.5px;font-weight:750;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<header class="top">
  <span class="brand">CHROMA<span>PICK</span></span>
  <span class="grow"></span>
  <button class="ghost" id="sampleBtn" type="button">샘플</button>
  <button class="ghost solid" id="pickBtn" type="button">사진</button>
</header>

<main class="scroll" id="scroll">
  <section class="empty" id="intro">
    <div class="dropmark" aria-hidden="true">◍</div>
    <h1>사진에서 색을 뽑아요</h1>
    <p>사진 한 장이면 대표 색 다섯 개를 뽑아 주고,<br>손가락으로 짚은 자리의 색을 그대로 따 줍니다.<br>사진은 기기 밖으로 나가지 않아요.</p>
    <div class="btns">
      <button class="primary" id="introPick" type="button">사진 불러오기</button>
      <button class="ghost" id="introSample" type="button">샘플 사진으로 해보기</button>
    </div>
  </section>

  <section class="shot" id="shotWrap" hidden>
    <div class="shot-frame" id="shotFrame">
      <canvas id="photo" role="img" aria-label="색을 딸 사진"></canvas>
      <div class="loupe" id="loupe" aria-hidden="true"><canvas id="loupeCv" width="132" height="132"></canvas></div>
    </div>
    <p class="hint" id="shotHint">사진을 콕 찍거나 문질러 색을 따 보세요</p>
  </section>

  <section id="paletteWrap" hidden>
    <div class="sec-head"><h2>대표 색 다섯</h2><span id="palNote">누르면 그 색으로 바뀝니다</span></div>
    <div class="pal" id="pal"></div>
  </section>

  <section id="pinsWrap" hidden>
    <div class="sec-head"><h2>고정한 색</h2><button class="link" id="clearPins" type="button">모두 지우기</button></div>
    <div class="pin-list" id="pins"></div>
  </section>

  <p class="foot-note" id="footNote" hidden>고정한 색은 이 브라우저에 남습니다. 사진 자체는 저장하지 않고, 앱을 닫으면 다시 불러와야 해요.</p>
</main>

<footer class="dock">
  <div class="dock-top">
    <span class="swatch" id="curChip" aria-hidden="true"></span>
    <div class="dock-meta">
      <b id="curHex">—</b>
      <small id="curInfo">사진을 불러오면 색을 딸 수 있어요</small>
    </div>
    <button class="ghost" id="pinBtn" type="button" disabled>고정</button>
  </div>
  <div class="dock-actions">
    <button class="primary" id="copyHex" type="button" disabled>HEX 복사</button>
    <button class="ghost" id="copyCss" type="button" disabled>CSS 변수</button>
  </div>
</footer>

<input id="file" type="file" accept="image/*" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const KEY='chromapick.v1';
const MAXDIM=1500, ZOOM=8, LOUPE=132;
const FALLBACK=[232,226,214];

let cv=null, ctx=null, W=0, H=0, DATA=null, sx=1, sy=1;
let cur=[232,226,214], pins=[], dragging=false, hideTimer=0, palette=[];

const hexOf=c=>'#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase();
const rgbOf=c=>'rgb('+c.map(v=>Math.round(v)).join(', ')+')';
const pad2=n=>String(n).padStart(2,'0');

/* ── 이름 ── */
function nameOf(c){
  const [r,g,b]=c.map(v=>v/255);
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, d=mx-mn;
  const s=d===0?0:d/(1-Math.abs(2*l-1));
  if(s<0.13) return l>0.86?'아이보리':l>0.66?'밝은 회색':l>0.36?'회색':l>0.18?'짙은 회색':'먹색';
  let h=0;
  if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4;
  h=(h*60+360)%360;
  if(h<12||h>=348) return '붉은색';
  if(h<38) return '주황';
  if(h<62) return '황토';
  if(h<78) return '노랑';
  if(h<105) return '연두';
  if(h<152) return '초록';
  if(h<186) return '청록';
  if(h<225) return '하늘색';
  if(h<262) return '파랑';
  if(h<292) return '보라';
  if(h<322) return '자주';
  return '분홍';
}
function inkOn(c){
  const f=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
  const lum=0.2126*f(c[0])+0.7152*f(c[1])+0.0722*f(c[2]);
  return lum>0.52?'#15150F':'#FFFDF7';
}

/* ── 저장 ── */
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify({pins:pins})); }catch(e){}
}
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY)||'null');
    if(raw&&Array.isArray(raw.pins)){
      pins=raw.pins.filter(h=>typeof h==='string'&&/^#[0-9A-F]{6}$/i.test(h)).slice(0,16).map(h=>h.toUpperCase());
    }
  }catch(e){}
}

/* ── 현재 색 반영 ── */
function applyPick(c,quiet){
  cur=c.slice(0,3);
  const hx=hexOf(cur);
  document.documentElement.style.setProperty('--pick',hx);
  document.documentElement.style.setProperty('--pick-ink',inkOn(cur));
  $('#curHex').textContent=hx;
  $('#curInfo').textContent=rgbOf(cur)+' · '+nameOf(cur);
  $('#pinBtn').disabled=false;
  $('#copyHex').disabled=false;
  $('#copyCss').disabled=false;
  document.querySelectorAll('#pal .sw').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.hex===hx)));
  if(!quiet) $('#pinBtn').textContent=pins.includes(hx)?'고정됨':'고정';
}

/* ── 팔레트 ── */
function buildPalette(){
  const sc=Math.min(1,120/Math.max(W,H));
  const pw=Math.max(8,Math.round(W*sc)), ph=Math.max(8,Math.round(H*sc));
  const c=document.createElement('canvas'); c.width=pw; c.height=ph;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(cv,0,0,pw,ph);
  const d=x.getImageData(0,0,pw,ph).data;
  const pts=[];
  for(let i=0;i<d.length;i+=4){ if(d[i+3]>40) pts.push([d[i],d[i+1],d[i+2]]); }
  if(!pts.length) return [];

  const lum=p=>0.2126*p[0]+0.7152*p[1]+0.0722*p[2];
  const sorted=pts.slice().sort((a,b)=>lum(a)-lum(b));
  const K=5;
  let cents=[];
  for(let i=0;i<K;i++){ cents.push(sorted[Math.min(sorted.length-1,Math.floor((i+0.5)/K*sorted.length))].slice()); }

  for(let it=0;it<16;it++){
    const acc=cents.map(()=>[0,0,0,0]);
    for(let p of pts){
      let best=0,bd=Infinity;
      for(let k=0;k<cents.length;k++){
        const dx=p[0]-cents[k][0],dy=p[1]-cents[k][1],dz=p[2]-cents[k][2];
        const dd=dx*dx+dy*dy+dz*dz;
        if(dd<bd){bd=dd;best=k;}
      }
      acc[best][0]+=p[0]; acc[best][1]+=p[1]; acc[best][2]+=p[2]; acc[best][3]++;
    }
    let moved=0;
    for(let k=0;k<cents.length;k++){
      if(!acc[k][3]) continue;
      const nc=[acc[k][0]/acc[k][3],acc[k][1]/acc[k][3],acc[k][2]/acc[k][3]];
      moved+=Math.abs(nc[0]-cents[k][0])+Math.abs(nc[1]-cents[k][1])+Math.abs(nc[2]-cents[k][2]);
      cents[k]=nc;
    }
    if(moved<2.4) break;
  }

  const total=pts.length;
  const out=cents.map(cen=>{
    let n=0;
    for(let p of pts){
      const dx=p[0]-cen[0],dy=p[1]-cen[1],dz=p[2]-cen[2];
      let best=0,bd=Infinity;
      for(let k=0;k<cents.length;k++){
        const ax=p[0]-cents[k][0],ay=p[1]-cents[k][1],az=p[2]-cents[k][2];
        const dd=ax*ax+ay*ay+az*az;
        if(dd<bd){bd=dd;best=k;}
      }
      if(cents[best]===cen) n++;
    }
    return {rgb:cen.map(v=>Math.round(v)),share:n/total,derived:false};
  }).filter(o=>o.share>0).sort((a,b)=>b.share-a.share);

  /* 색이 한두 개뿐인 사진은 톤을 더해 다섯 칸을 채운다 */
  const base=out[0]?out[0].rgb:FALLBACK;
  let step=0;
  while(out.length<5){
    step++;
    const t=step%2?0.22*(1+Math.floor(step/2)):-0.20*(1+Math.floor(step/2));
    const mix=base.map(v=>t>0?v+(255-v)*t:v*(1+t));
    out.push({rgb:mix.map(v=>Math.round(v)),share:0,derived:true});
  }
  return out.slice(0,5);
}

function renderPalette(){
  const box=$('#pal'); box.innerHTML='';
  palette.forEach(c=>{
    const b=document.createElement('button');
    b.type='button'; b.className='sw'; b.dataset.hex=hexOf(c.rgb);
    b.setAttribute('aria-label',hexOf(c.rgb)+' '+nameOf(c.rgb)+' 선택');
    b.setAttribute('aria-pressed',String(hexOf(c.rgb)===hexOf(cur)));
    const blk=document.createElement('span'); blk.className='block'; blk.style.background=hexOf(c.rgb);
    const tx=document.createElement('span'); tx.className='txt';
    const hex=document.createElement('b'); hex.textContent=hexOf(c.rgb);
    const sh=document.createElement('small');
    sh.textContent=c.derived?'톤':Math.max(1,Math.round(c.share*100))+'%';
    tx.append(hex,sh); b.append(blk,tx);
    b.addEventListener('click',()=>{ applyPick(c.rgb); toast(hexOf(c.rgb)+' 선택'); });
    box.append(b);
  });
  $('#palNote').textContent=palette.length?'누르면 그 색으로 바뀝니다':'';
}

/* ── 고정한 색 ── */
function renderPins(){
  const box=$('#pins'); box.innerHTML='';
  if(!pins.length){
    const p=document.createElement('p'); p.className='pins-empty';
    p.textContent='마음에 드는 색은 아래 고정 버튼으로 담아 두세요.';
    box.append(p);
    $('#clearPins').hidden=true;
    return;
  }
  $('#clearPins').hidden=false;
  pins.forEach(hx=>{
    const wrap=document.createElement('span'); wrap.className='pin';
    const main=document.createElement('button'); main.type='button'; main.className='main';
    main.setAttribute('aria-label',hx+' 복사');
    const dot=document.createElement('i'); dot.style.background=hx;
    const b=document.createElement('b'); b.textContent=hx;
    main.append(dot,b);
    main.addEventListener('click',async()=>{
      const ok=await copyText(hx);
      toast(ok?hx+' 복사했어요':'길게 눌러 직접 복사해 주세요');
    });
    const del=document.createElement('button'); del.type='button'; del.className='del';
    del.textContent='×'; del.setAttribute('aria-label',hx+' 고정 해제');
    del.addEventListener('click',e=>{
      e.stopPropagation();
      pins=pins.filter(v=>v!==hx); save(); renderPins(); refreshPinBtn(); toast('고정을 풀었어요');
    });
    wrap.append(main,del); box.append(wrap);
  });
}
function refreshPinBtn(){
  const hx=hexOf(cur);
  $('#pinBtn').textContent=pins.includes(hx)?'고정됨':'고정';
}

$('#pinBtn').addEventListener('click',()=>{
  const hx=hexOf(cur);
  if(!cv) return;
  if(pins.includes(hx)){ pins=pins.filter(v=>v!==hx); toast('고정을 풀었어요'); }
  else{
    pins=[hx,...pins].slice(0,16);
    toast(hx+' 고정했어요');
  }
  save(); renderPins(); refreshPinBtn();
});
$('#clearPins').addEventListener('click',()=>{
  if(!pins.length) return;
  if(!confirm('고정한 색을 모두 지울까요?')) return;
  pins=[]; save(); renderPins(); refreshPinBtn(); toast('모두 지웠어요');
});

/* ── 복사 ── */
async function copyText(text){
  try{
    if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;left:-9999px;top:0';
    document.body.append(ta); ta.select(); ta.setSelectionRange(0,text.length);
    const ok=document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}
$('#copyHex').addEventListener('click',async()=>{
  if(!cv) return;
  const ok=await copyText(hexOf(cur));
  toast(ok?hexOf(cur)+' 복사했어요':'HEX를 길게 눌러 복사해 주세요');
});
$('#copyCss').addEventListener('click',async()=>{
  if(!cv) return;
  const css='--color: '+hexOf(cur)+';';
  const ok=await copyText(css);
  toast(ok?css+' 복사했어요':'CSS를 직접 입력해 주세요');
});

/* ── 사진 ── */
const fileInput=$('#file');
$('#pickBtn').addEventListener('click',()=>fileInput.click());
$('#introPick').addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  if(f) loadFile(f);
  e.target.value='';
});

document.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items) return;
  for(const it of items){
    if(it.type.startsWith('image/')){ const f=it.getAsFile(); if(f){ loadFile(f); e.preventDefault(); return; } }
  }
});
const scrollEl=$('#scroll');
scrollEl.addEventListener('dragover',e=>{ e.preventDefault(); $('#intro').classList.add('dragover'); });
scrollEl.addEventListener('dragleave',()=>$('#intro').classList.remove('dragover'));
scrollEl.addEventListener('drop',e=>{
  e.preventDefault(); $('#intro').classList.remove('dragover');
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f) loadFile(f);
});

async function loadFile(file){
  if(!file.type.startsWith('image/')){ toast('이미지 파일이 아니에요'); return; }
  try{
    let bmp=null;
    if(window.createImageBitmap){
      try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }
      catch(e){ bmp=await createImageBitmap(file); }
    }
    if(!bmp){
      bmp=await new Promise((res,rej)=>{
        const img=new Image();
        img.onload=()=>res(img); img.onerror=rej;
        img.src=URL.createObjectURL(file);
        setTimeout(()=>{ if(!img.width) rej(new Error('read fail')); },8000);
      });
    }
    useSource(bmp);
  }catch(err){ toast('사진을 열지 못했어요'); }
}

function useSource(src){
  const sw=src.width||src.naturalWidth, sh=src.height||src.naturalHeight;
  if(!sw||!sh){ toast('사진 크기를 읽지 못했어요'); return; }
  const k=Math.min(1,MAXDIM/Math.max(sw,sh));
  W=Math.max(1,Math.round(sw*k)); H=Math.max(1,Math.round(sh*k));
  cv=$('#photo'); cv.width=W; cv.height=H;
  ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(src,0,0,W,H);
  DATA=ctx.getImageData(0,0,W,H);

  $('#intro').hidden=true;
  $('#shotWrap').hidden=false;
  $('#paletteWrap').hidden=false;
  $('#pinsWrap').hidden=false;
  $('#footNote').hidden=false;
  $('#shotHint').textContent='사진을 콕 찍거나 문질러 색을 따 보세요';

  palette=buildPalette();
  const first=palette[0]?palette[0].rgb:FALLBACK;
  applyPick(first,true);
  renderPalette(); renderPins(); refreshPinBtn();
  window.scrollTo?.(0,0); scrollEl.scrollTop=0;
  toast('대표 색을 뽑았어요');
}

/* ── 루페 · 픽셀 따기 ── */
function sampleAt(clientX,clientY){
  if(!DATA) return;
  const r=cv.getBoundingClientRect();
  if(!r.width||!r.height) return;
  const x=Math.max(0,Math.min(W-1,Math.round((clientX-r.left)/r.width*W)));
  const y=Math.max(0,Math.min(H-1,Math.round((clientY-r.top)/r.height*H)));
  const i=(y*W+x)*4, d=DATA.data;
  applyPick([d[i],d[i+1],d[i+2]]);
  placeLoupe(clientX,clientY,x,y);
}
function placeLoupe(clientX,clientY,px,py){
  const l=$('#loupe');
  const lc=$('#loupeCv'), lx2=lc.getContext('2d');
  const half=LOUPE/2, r=$('#shotFrame').getBoundingClientRect();
  const lx=clientX-r.left, ly=clientY-r.top;
  const src=LOUPE/ZOOM;
  lx2.imageSmoothingEnabled=false;
  lx2.fillStyle='#101012'; lx2.fillRect(0,0,LOUPE,LOUPE);
  lx2.drawImage(cv,px-src/2,py-src/2,src,src,0,0,LOUPE,LOUPE);
  /* 가운데 픽셀 표시 */
  const ps=LOUPE/src;
  lx2.lineWidth=1.5;
  lx2.strokeStyle='rgba(0,0,0,.65)'; lx2.strokeRect(half-ps/2-1,half-ps/2-1,ps+2,ps+2);
  lx2.strokeStyle='rgba(255,255,255,.95)'; lx2.strokeRect(half-ps/2,half-ps/2,ps,ps);

  let x=lx, y=ly-half-34;
  if(y-half<2){ y=ly+half+34; }
  x=Math.max(half+2,Math.min(r.width-half-2,x));
  if(r.height>half*2+4){ y=Math.min(Math.max(half+2,y),r.height-half-2); }
  l.style.left=x+'px'; l.style.top=y+'px';
  l.classList.add('on');
}
function hideLoupeSoon(){
  clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>$('#loupe').classList.remove('on'),30000);
}

cv=$('#photo');
cv.addEventListener('pointerdown',e=>{
  if(!DATA) return;
  e.preventDefault();
  dragging=true;
  clearTimeout(hideTimer);
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  sampleAt(e.clientX,e.clientY);
});
cv.addEventListener('pointermove',e=>{
  if(!dragging) return;
  e.preventDefault();
  sampleAt(e.clientX,e.clientY);
});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{ dragging=false; hideLoupeSoon(); }));
cv.addEventListener('pointerleave',()=>{ if(dragging){ dragging=false; hideLoupeSoon(); } });

/* ── 샘플 사진 ── */
function makeSample(){
  const c=document.createElement('canvas'); c.width=1080; c.height=1440;
  const g=c.getContext('2d');
  const w=c.width, h=c.height, hz=Math.round(h*0.62);
  const sky=g.createLinearGradient(0,0,0,hz);
  sky.addColorStop(0,'#221A3C'); sky.addColorStop(0.42,'#6B3557');
  sky.addColorStop(0.74,'#D9714B'); sky.addColorStop(1,'#F7C084');
  g.fillStyle=sky; g.fillRect(0,0,w,hz);

  const sunX=w*0.63, sunY=hz-h*0.055, sunR=w*0.115;
  const halo=g.createRadialGradient(sunX,sunY,sunR*0.4,sunX,sunY,sunR*4.2);
  halo.addColorStop(0,'rgba(255,214,150,.75)'); halo.addColorStop(0.4,'rgba(250,160,110,.28)');
  halo.addColorStop(1,'rgba(250,160,110,0)');
  g.fillStyle=halo; g.beginPath(); g.arc(sunX,sunY,sunR*4.2,0,7); g.fill();
  g.fillStyle='#FFE3B2'; g.beginPath(); g.arc(sunX,sunY,sunR,0,7); g.fill();

  /* 구름 */
  const cloud=(cx,cy,sc,al,col)=>{
    g.save(); g.globalAlpha=al; g.fillStyle=col; g.beginPath();
    g.ellipse(cx,cy,sc,sc*0.28,0,0,7);
    g.ellipse(cx+sc*0.55,cy-sc*0.1,sc*0.55,sc*0.2,0,0,7);
    g.ellipse(cx-sc*0.5,cy+sc*0.06,sc*0.5,sc*0.16,0,0,7);
    g.fill(); g.restore();
  };
  cloud(w*0.26,h*0.2,w*0.3,.30,'#B78BA8');
  cloud(w*0.72,h*0.32,w*0.36,.26,'#F2A6A0');
  cloud(w*0.42,h*0.46,w*0.4,.22,'#FFC9A4');

  /* 산 */
  const ridge=(base,amp,col,seed)=>{
    g.fillStyle=col; g.beginPath(); g.moveTo(0,hz);
    let rnd=seed;
    const rand=()=>{rnd=(rnd*9301+49297)%233280;return rnd/233280;};
    for(let x=0;x<=w;x+=w/16){
      const y=base-Math.sin(x/w*3.1+seed)*amp-rand()*amp*0.5;
      g.lineTo(x,y);
    }
    g.lineTo(w,hz); g.closePath(); g.fill();
  };
  ridge(hz-h*0.035,h*0.085,'#3A2740',1.7);
  ridge(hz-h*0.008,h*0.05,'#241A2E',3.1);

  /* 물 */
  const wt=g.createLinearGradient(0,hz,0,h);
  wt.addColorStop(0,'#5C3347'); wt.addColorStop(0.35,'#33203A'); wt.addColorStop(1,'#15101F');
  g.fillStyle=wt; g.fillRect(0,hz,w,h-hz);
  g.save();
  g.globalAlpha=.42;
  for(let i=0;i<70;i++){
    const y=hz+Math.pow(i/70,1.5)*(h-hz);
    const len=(w*0.32)*(1-i/90)+w*0.02;
    g.fillStyle=i%7===0?'rgba(255,220,170,.55)':'rgba(255,190,140,.22)';
    g.fillRect(sunX-len/2+(Math.random()-0.5)*w*0.06,y,len,Math.max(1,h*0.0035));
  }
  g.restore();

  /* 앞쪽 잎 실루엣 */
  g.fillStyle='#120C1A';
  g.beginPath(); g.moveTo(0,h);
  for(let x=0;x<=w*0.22;x+=w*0.02){ g.lineTo(x,h-Math.abs(Math.sin(x*0.014))*h*0.16); }
  g.lineTo(w*0.22,h); g.closePath(); g.fill();

  /* 입자 */
  g.save();
  for(let i=0;i<2600;i++){
    g.globalAlpha=Math.random()*0.05;
    g.fillStyle=Math.random()>0.5?'#FFFFFF':'#000000';
    g.fillRect(Math.random()*w,Math.random()*h,1.4,1.4);
  }
  g.restore();
  return c;
}
$('#sampleBtn').addEventListener('click',()=>useSource(makeSample()));
$('#introSample').addEventListener('click',()=>useSource(makeSample()));

/* ── 토스트 ── */
let tt=0;
function toast(m){
  const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1900);
}

/* ── 확대 방지 ── */
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});

load();
renderPins();
refreshPinBtn();
applyPick(FALLBACK,true);
$('#pinBtn').disabled=true; $('#copyHex').disabled=true; $('#copyCss').disabled=true;
})();
</script>
